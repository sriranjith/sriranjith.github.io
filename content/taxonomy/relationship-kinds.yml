# Controlled vocabulary: Relationship kind
# `inverse` lets the site derive back-links automatically, so a relationship
# only ever needs to be written once, on one side.
- id: related
  label: Related to
  inverse: related
  short: Shares a core idea.
  order: 10
- id: influenced-by
  label: Influenced by
  inverse: influences
  short: This paradox was shaped by that one.
  order: 20
- id: influences
  label: Influences
  inverse: influenced-by
