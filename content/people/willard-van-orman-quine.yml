id: willard-van-orman-quine
name: Willard Van Orman Quine
born: 1908
died: 2000
tradition: American analytic philosophy and logic
bio: >-
  Philosopher and logician at Harvard for most of his career. He supplied the
  vocabulary this site uses for classifying paradoxes — veridical, falsidical,
  antinomy — in "The Ways of Paradox" (1962). His two-page note "On a So-called
  Paradox" (1953) located the flaw in the condemned prisoner's reasoning at its
  very first step.
url: https://en.wikipedia.org/wiki/Willard_Van_Orman_Quine
