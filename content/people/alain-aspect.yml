id: alain-aspect
name: Alain Aspect
born: 1947
tradition: French experimental physics
bio: >-
  French physicist whose experiments at Orsay between 1981 and 1982 gave the
  first high-precision violations of Bell's inequalities, including the
  celebrated 1982 run with time-varying analysers that closed the locality
  loophole to a substantial degree. He shared the 2022 Nobel Prize in Physics
  with John Clauser and Anton Zeilinger.
url: https://en.wikipedia.org/wiki/Alain_Aspect
