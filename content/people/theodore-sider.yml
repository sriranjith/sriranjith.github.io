id: theodore-sider
name: Theodore Sider
tradition: American analytic metaphysics
bio: >-
  Professor of philosophy at Rutgers University. His Four-Dimensionalism (2001)
  is the standard defence of the view that objects persist by having temporal
  parts, which turns the Ship of Theseus from a question about one object into a
  question about two overlapping spacetime worms.
url: https://en.wikipedia.org/wiki/Theodore_Sider
