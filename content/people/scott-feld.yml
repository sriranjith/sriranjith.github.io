id: scott-feld
name: Scott L. Feld
born: 1947
tradition: American sociology and social network analysis
bio: >-
  Sociologist, latterly at Purdue University, who works on social network
  structure and the "focus theory" of how ties form. His 1991 paper "Why Your
  Friends Have More Friends Than You Do" named and explained the friendship
  paradox, using Coleman's data on adolescent friendships to show the effect in
  a real network.
