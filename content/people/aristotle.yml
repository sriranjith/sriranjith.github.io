id: aristotle
name: Aristotle
born: -384
died: -322
tradition: Greek philosophy; the Lyceum
bio: >-
  Student of Plato and founder of the Lyceum. His Physics is the earliest
  surviving text to state Zeno's four arguments against motion, and his replies —
  that a length and the time to cross it are divisible in exactly the same way,
  and that an infinity of divisions is potential rather than actual — set the
  terms of the debate for the next two thousand years.
