id: amos-tversky
name: Amos Tversky
born: 1937
died: 1996
tradition: Israeli cognitive psychology
bio: >-
  Israeli cognitive psychologist, latterly at Stanford, and Daniel Kahneman's
  collaborator on judgement under uncertainty and prospect theory. He also worked
  on the foundations of measurement, on similarity, and on the axiomatics of
  choice. He died of metastatic melanoma in 1996, six years before the Nobel
  Prize recognised the work.
