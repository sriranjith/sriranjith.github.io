id: rodney-brooks
name: Rodney Brooks
born: 1954
tradition: Robotics and embodied artificial intelligence
bio: >-
  Australian roboticist, former director of the MIT Computer Science and
  Artificial Intelligence Laboratory and co-founder of iRobot and Rethink
  Robotics. His behaviour-based robotics argued that intelligence rests on
  perception and action rather than on symbolic reasoning laid over them.
url: https://en.wikipedia.org/wiki/Rodney_Brooks
