id: timothy-chow
name: Timothy Y. Chow
tradition: American mathematics
bio: >-
  Mathematician, with a 1995 MIT doctorate under Richard Stanley, who has worked
  in combinatorics and at the Center for Communications Research. His 1998
  American Mathematical Monthly survey of the surprise examination paradox is the
  standard map of the literature, sorting five decades of proposed solutions into
  a small number of genuinely distinct positions.
url: https://timothychow.net/
