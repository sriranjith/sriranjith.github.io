id: gerard-t-hooft
name: Gerard 't Hooft
born: 1946
tradition: Dutch theoretical physics
bio: >-
  Utrecht theorist who shared the 1999 Nobel Prize in Physics with Martinus
  Veltman for showing that non-abelian gauge theories are renormalisable. In
  1993 he proposed dimensional reduction in quantum gravity — the idea that the
  degrees of freedom in a region are encoded on its boundary — which Susskind
  developed into the holographic principle.
