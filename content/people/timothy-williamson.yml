id: timothy-williamson
name: Timothy Williamson
born: 1955
tradition: British analytic philosophy
bio: >-
  Wykeham Professor of Logic at the University of Oxford from 2000 to 2024. His
  1994 book Vagueness is the canonical statement of epistemicism: the view that
  vague terms do have sharp boundaries and that vagueness is a form of ignorance,
  not of meaning. The position keeps classical logic intact at the cost of a
  claim most people find hard to swallow.
url: https://en.wikipedia.org/wiki/Timothy_Williamson
