id: michael-paterson
name: Michael S. Paterson
tradition: British computer science
bio: >-
  British computer scientist and long-serving professor at the University of
  Warwick, where he founded the Centre for Discrete Mathematics and its
  Applications. He worked on algorithms, complexity and combinatorics, and with
  Michael Fischer and Nancy Lynch proved the 1985 impossibility of asynchronous
  deterministic consensus.
