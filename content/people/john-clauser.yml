id: john-clauser
name: John Clauser
born: 1942
tradition: American experimental physics
bio: >-
  Co-author of the 1969 CHSH inequality, which recast Bell's theorem into a form
  that a real laboratory could test, and with Stuart Freedman performed the
  first such experiment in 1972 at Berkeley. He expected to confirm hidden
  variables and was disappointed by his own result. He shared the 2022 Nobel
  Prize in Physics with Alain Aspect and Anton Zeilinger.
