id: adam-elga
name: Adam Elga
born: 1974
tradition: American analytic philosophy
bio: >-
  Philosopher at Princeton working on formal epistemology, self-locating belief
  and disagreement. His three-page 2000 paper in Analysis gave the Sleeping
  Beauty problem its name and its thirder answer, and started a debate that has
  run for more than two decades without resolution.
url: https://en.wikipedia.org/wiki/Adam_Elga
