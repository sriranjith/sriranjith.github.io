id: erwin-schrodinger
name: Erwin Schrödinger
born: 1887
died: 1961
tradition: Austrian theoretical physics
bio: >-
  Viennese physicist who formulated wave mechanics in 1926, giving quantum
  theory the equation that bears his name, and shared the 1933 Nobel Prize in
  Physics with Paul Dirac. He was never reconciled to the Copenhagen reading of
  his own equation, and his 1935 cat scenario was written as a criticism of it,
  not an endorsement. He left Austria after the Anschluss, spent the war years
  at the Dublin Institute for Advanced Studies, and there wrote "What Is Life?"
  (1944), which influenced a generation of molecular biologists.
url: https://en.wikipedia.org/wiki/Erwin_Schr%C3%B6dinger
