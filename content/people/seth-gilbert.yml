id: seth-gilbert
name: Seth Gilbert
tradition: American and Singaporean computer science
bio: >-
  Computer scientist working on distributed algorithms and fault tolerance, a
  professor at the National University of Singapore. As a doctoral student with
  Nancy Lynch at MIT he co-authored the 2002 paper that turned Brewer's CAP
  conjecture into a proved theorem by making its terms precise — and in doing so
  made clear how much narrower the theorem is than the slogan built on it.
