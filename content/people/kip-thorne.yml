id: kip-thorne
name: Kip Thorne
born: 1940
tradition: American theoretical physics
bio: >-
  Caltech relativist, shared the 2017 Nobel Prize in Physics for the LIGO
  detection of gravitational waves, and a co-founder of LIGO itself. With Michael
  Morris and Ulvi Yurtsever he showed in 1988 how a traversable wormhole could in
  principle be turned into a time machine, which reopened serious physics work on
  causality violation — including his group's collaboration with Novikov on
  self-consistency.
url: https://en.wikipedia.org/wiki/Kip_Thorne
