id: marilyn-vos-savant
name: Marilyn vos Savant
born: 1946
tradition: American popular writing on reasoning
bio: >-
  Columnist for Parade magazine. Her 1990 answer to the Monty Hall problem was
  correct and provoked roughly ten thousand letters of disagreement, around a
  thousand from readers holding doctorates — one of the best-documented episodes
  of collective expert error on a simple question.
url: https://en.wikipedia.org/wiki/Marilyn_vos_Savant
