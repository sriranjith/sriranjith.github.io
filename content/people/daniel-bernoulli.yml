id: daniel-bernoulli
name: Daniel Bernoulli
born: 1700
died: 1782
tradition: Swiss mathematics and physics
bio: >-
  Best known for the principle relating fluid speed to pressure that carries his
  name. His 1738 St Petersburg paper did something else entirely: it proposed
  that people value money not by its amount but by a concave function of it, and
  that "the utility resulting from any small increase in wealth will be
  inversely proportionate to the quantity of goods previously possessed" — the
  first statement of diminishing marginal utility, and the seed of modern
  expected-utility theory.
url: https://en.wikipedia.org/wiki/Daniel_Bernoulli
