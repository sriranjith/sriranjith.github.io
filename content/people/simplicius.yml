id: simplicius
name: Simplicius of Cilicia
born: 480
died: 560
tradition: Late Neoplatonism
bio: >-
  Neoplatonist commentator on Aristotle, writing in the sixth century CE. His
  enormous commentary on the Physics quotes older texts at length, and is the
  sole surviving witness to the verbatim words of several Presocratics. Almost
  everything anyone can quote of Zeno exists because Simplicius copied it out
  roughly a thousand years after it was written.
url: https://en.wikipedia.org/wiki/Simplicius_of_Cilicia
