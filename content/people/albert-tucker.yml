id: albert-tucker
name: Albert W. Tucker
born: 1905
died: 1995
tradition: Canadian-American mathematics
bio: >-
  Princeton mathematician, known for the Karush-Kuhn-Tucker conditions in
  optimisation and as the doctoral adviser of John Nash. In 1950, needing a way
  to explain the Flood-Dresher game to an audience of psychologists, he invented
  the story of two prisoners interrogated separately and gave the dilemma the
  name it has carried ever since.
url: https://en.wikipedia.org/wiki/Albert_W._Tucker
