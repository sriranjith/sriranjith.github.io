id: gregory-chaitin
name: Gregory Chaitin
born: 1947
tradition: Algorithmic information theory
bio: >-
  Argentine-American mathematician and computer scientist, one of the
  independent founders of algorithmic information theory alongside Kolmogorov
  and Solomonoff. His 1974 incompleteness theorem turns Berry's paradox into a
  precise limit: no consistent formal system can prove that any specific string
  has complexity much greater than the system's own description.
