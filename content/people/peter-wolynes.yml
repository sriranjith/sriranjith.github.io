id: peter-wolynes
name: Peter G. Wolynes
born: 1953
tradition: Theoretical chemistry and biophysics
bio: >-
  American theoretical chemist, now at Rice University, who brought the
  statistical mechanics of spin glasses to protein folding. With Joseph
  Bryngelson he introduced the principle of minimal frustration in 1987, the idea
  that grew into energy landscape theory and the folding funnel.
url: https://en.wikipedia.org/wiki/Peter_Wolynes
