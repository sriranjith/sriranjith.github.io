id: edward-simpson
name: Edward H. Simpson
born: 1922
died: 2019
tradition: British statistics and cryptanalysis
bio: >-
  British statistician and civil servant. He worked at Bletchley Park during the
  Second World War and spent most of his career in the Home Civil Service. His
  single, brief 1951 paper on contingency tables gave its name to the reversal
  effect, although he was careful to credit the underlying observation to earlier
  writers and never claimed to have discovered it.
url: https://en.wikipedia.org/wiki/Edward_H._Simpson
