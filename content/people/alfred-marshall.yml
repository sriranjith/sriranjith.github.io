id: alfred-marshall
name: Alfred Marshall
born: 1842
died: 1924
tradition: English neoclassical economics
bio: >-
  Professor of political economy at Cambridge and the dominant figure in
  English-language economics for a generation. His Principles of Economics (1890)
  introduced supply-and-demand diagrams, price elasticity, consumer surplus and
  the short-run/long-run distinction, and remained the standard textbook for
  decades. The third edition of 1895 added the passage attributing upward-sloping
  demand for bread to Robert Giffen.
url: https://en.wikipedia.org/wiki/Alfred_Marshall
