id: laurence-sterne
name: Laurence Sterne
born: 1713
died: 1768
tradition: British literature
bio: >-
  Irish-born English novelist whose eccentric masterpiece, The Life and Opinions
  of Tristram Shandy, Gentleman (published in volumes from 1759 to 1767),
  introduced the narrator who cannot finish his own autobiography because writing
  about his life takes longer than living it. The novel's preoccupation with
  time, memory, and the impossibility of complete self-narration gave Bertrand
  Russell the vehicle for a paradox about infinite sets: if Tristram had infinite
  time, could he eventually finish? The novel is now recognised as a forerunner
  of modernist fiction.
