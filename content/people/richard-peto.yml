id: richard-peto
name: Richard Peto
born: 1943
tradition: British epidemiology and medical statistics
bio: >-
  British statistician and epidemiologist at Oxford, best known for large-scale
  work on the health effects of smoking and on cancer trial methodology. In a
  1975 paper on cancer and ageing in mice and men he noted that cancer incidence
  does not scale with body size across species — the observation later named
  Peto's paradox.
