id: galileo-galilei
name: Galileo Galilei
born: 1564
died: 1642
tradition: Italian natural philosophy and mathematics
bio: >-
  Pisan mathematician, astronomer and physicist. Beyond the telescope and the
  law of falling bodies, his final book — the Discorsi of 1638, written under
  house arrest — contains the first clear statement that the squares can be
  matched one-for-one with the whole numbers, and the first honest account of
  why that ought to worry you.
url: https://en.wikipedia.org/wiki/Galileo_Galilei
