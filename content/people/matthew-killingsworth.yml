id: matthew-killingsworth
name: Matthew Killingsworth
tradition: American happiness research
bio: >-
  Senior fellow at the Wharton School of the University of Pennsylvania and
  creator of the Track Your Happiness experience-sampling project, which collects
  in-the-moment wellbeing reports by smartphone. His 2021 analysis of 1.7 million
  such reports found that experienced wellbeing keeps rising with income above
  $75,000 a year, contradicting the earlier plateau finding, and he then settled
  the disagreement through an adversarial collaboration with Daniel Kahneman.
