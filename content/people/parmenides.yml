id: parmenides
name: Parmenides of Elea
born: -515
died: -450
tradition: Eleatic philosophy (Greek, southern Italy)
bio: >-
  Author of a hexameter poem, substantial parts of which survive, arguing that
  what-is must be ungenerated, indivisible and unchanging, and that motion and
  plurality belong to the deceptive "way of opinion". Zeno's paradoxes were
  written in defence of this position.
url: https://en.wikipedia.org/wiki/Parmenides
