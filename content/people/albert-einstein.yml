id: albert-einstein
name: Albert Einstein
born: 1879
died: 1955
tradition: German-Swiss-American theoretical physics
bio: >-
  Author of special relativity (1905), general relativity (1915) and the light
  quantum hypothesis for which he received the 1921 Nobel Prize. He was one of
  the founders of quantum theory and its most formidable lifelong critic,
  arguing through the 1927 and 1930 Solvay conferences and the 1935 EPR paper
  that the quantum description of reality is incomplete rather than wrong.
  Bell's theorem later showed that the kind of completion Einstein wanted is
  not available.
url: https://en.wikipedia.org/wiki/Albert_Einstein
