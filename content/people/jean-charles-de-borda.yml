id: jean-charles-de-borda
name: Jean-Charles de Borda
born: 1733
died: 1799
tradition: French mathematics and naval science
bio: >-
  French mathematician, physicist and naval officer. In 1770 he read a memoir to
  the Académie royale des sciences proposing the rank-scoring election method now
  called the Borda count, published in 1781 as Mémoire sur les élections au
  scrutin. He also worked on fluid mechanics, surveying instruments, and the
  meridian measurements that fixed the length of the metre.
url: https://en.wikipedia.org/wiki/Jean-Charles_de_Borda
