id: edward-harrison
name: Edward Robert Harrison
born: 1919
died: 2007
tradition: British-American cosmology
bio: >-
  Cosmologist at the University of Massachusetts Amherst, co-author of the
  Harrison–Zel'dovich spectrum of primordial density fluctuations. His Darkness
  at Night (1987) traced the dark-sky problem from Kepler to modern cosmology,
  recovered Poe's priority, and made the case — now standard — that the finite
  age of the universe, not expansion or absorption, is the reason the night is
  dark.
url: https://en.wikipedia.org/wiki/Edward_Robert_Harrison
