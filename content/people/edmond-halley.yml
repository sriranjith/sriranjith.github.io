id: edmond-halley
name: Edmond Halley
born: 1656
died: 1742
tradition: English astronomy
bio: >-
  Astronomer Royal, financier of Newton's Principia, and predictor of the return
  of the comet that bears his name. In two papers read to the Royal Society in
  1721 he took up the question of why an infinite sphere of fixed stars does not
  set the night sky ablaze, and offered an argument from the diminishing
  apparent size of remote stars that does not, in fact, work.
