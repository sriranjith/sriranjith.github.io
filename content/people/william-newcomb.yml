id: william-newcomb
name: William Newcomb
born: 1927
died: 1999
tradition: American theoretical physics
bio: >-
  Physicist at the Lawrence Livermore National Laboratory whose single most
  lasting contribution to intellectual history was never published. Around 1960
  he posed, in private conversation, the decision problem that bears his name. The
  problem reached a wider audience only when Robert Nozick described it in 1969,
  crediting Newcomb by name. Newcomb's own views on the correct choice are not
  on record.
url: https://en.wikipedia.org/wiki/Newcomb%27s_paradox
