id: socrates
name: Socrates
born: -470
died: -399
tradition: Ancient Greek philosophy
bio: >-
  Athenian philosopher who wrote nothing but whose method of inquiry — question
  and answer, pushing interlocutors to examine their assumptions — defined the
  philosophical tradition. He is the principal speaker in Plato's dialogues,
  including the Meno, where he draws out the paradox of inquiry: we cannot search
  for what we already know, and we cannot search for what we do not know, since
  we would not recognise it if we found it. He was tried and executed by Athens
  in 399 BCE on charges of impiety and corrupting the youth.
url: https://en.wikipedia.org/wiki/Socrates
