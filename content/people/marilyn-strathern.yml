id: marilyn-strathern
name: Marilyn Strathern
born: 1941
tradition: British social anthropology
bio: >-
  British social anthropologist, Professor of Social Anthropology at Cambridge
  and a leading analyst of audit culture. Her 1997 essay on ratings in British
  universities supplied the phrasing by which Goodhart's Law is now almost
  always quoted: "When a measure becomes a target, it ceases to be a good
  measure."
url: https://en.wikipedia.org/wiki/Marilyn_Strathern
