id: daniel-ellsberg
name: Daniel Ellsberg
born: 1931
died: 2023
tradition: American economics and political activism
bio: >-
  Economist and strategic analyst who trained at Harvard under Thomas Schelling
  and worked at the RAND Corporation. His 1961 doctoral dissertation introduced
  what became known as the Ellsberg Paradox, showing that people systematically
  prefer bets on known probabilities over bets on unknown ones — violating the
  axioms of subjective expected utility theory. He is equally known for leaking
  the Pentagon Papers to the press in 1971, for which he faced federal espionage
  charges that were eventually dismissed.
