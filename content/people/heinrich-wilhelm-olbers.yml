id: heinrich-wilhelm-olbers
name: Heinrich Wilhelm Olbers
born: 1758
died: 1840
tradition: German observational astronomy
bio: >-
  Bremen physician who observed the sky from the top floor of his house after
  his patients were seen. He discovered the asteroids Pallas (1802) and Vesta
  (1807) and devised a still-used method for computing cometary orbits. His 1823
  essay "Ueber die Durchsichtigkeit des Weltraums" restated the puzzle of the
  dark night sky and proposed that interstellar matter absorbs the missing
  light — an answer now known to be wrong, attached to a question that has
  carried his name ever since.
url: https://en.wikipedia.org/wiki/Heinrich_Wilhelm_Matthias_Olbers
