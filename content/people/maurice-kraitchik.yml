id: maurice-kraitchik
name: Maurice Kraitchik
born: 1882
died: 1957
tradition: Belgian recreational mathematics and number theory
bio: >-
  Number theorist who worked on factorisation methods that later fed into the
  quadratic sieve, and an editor of the journal Sphinx. He is remembered here
  for his recreational writing: the necktie paradox and the wallet game in his
  "Mathematical Recreations" are the earliest widely circulated forms of what is
  now the two envelopes problem. He posed the puzzle without resolving it.
url: https://en.wikipedia.org/wiki/Maurice_Kraitchik
