id: john-rawls
name: John Rawls
born: 1921
died: 2002
tradition: American political philosophy
bio: >-
  Harvard philosopher whose A Theory of Justice (1971) reshaped Anglophone
  political philosophy. Section 35 of that book addresses the toleration of the
  intolerant directly, and concludes that a just society should restrict the
  liberty of intolerant sects only when the tolerant sincerely and with reason
  believe their own security is genuinely in danger.
