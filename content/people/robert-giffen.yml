id: robert-giffen
name: Robert Giffen
born: 1837
died: 1910
tradition: British official statistics
bio: >-
  Scottish statistician and economist. He worked as a journalist at The Economist
  under Walter Bagehot, then headed the statistical department of the Board of
  Trade, and served as president of the Royal Statistical Society from 1882 to
  1884. He was knighted in 1895. He wrote extensively on working-class budgets
  and on the price of bread, but no passage stating the phenomenon Marshall named
  after him has ever been located in his published work.
url: https://en.wikipedia.org/wiki/Robert_Giffen
