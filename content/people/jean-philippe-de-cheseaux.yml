id: jean-philippe-de-cheseaux
name: Jean-Philippe Loys de Chéseaux
born: 1718
died: 1751
tradition: Swiss astronomy
bio: >-
  Astronomer of Lausanne, best remembered for his observations of the great
  comet of 1743. In an appendix to that work he gave the first genuinely
  quantitative treatment of the dark-sky problem, computing how far one must
  look before stars tile the whole sky, and proposed — as Olbers would
  independently, eighty years later — that a tenuous absorbing medium swallows
  the missing light.
url: https://en.wikipedia.org/wiki/Jean-Philippe_de_Cheseaux
