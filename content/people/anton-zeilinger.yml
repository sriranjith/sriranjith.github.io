id: anton-zeilinger
name: Anton Zeilinger
born: 1945
tradition: Austrian experimental physics
bio: >-
  Austrian experimentalist who pioneered multi-particle entanglement, quantum
  teleportation, and entanglement-based quantum cryptography, and pushed Bell
  tests to ever longer distances and tighter loopholes. His group also
  demonstrated matter-wave interference with large molecules such as C60. He
  shared the 2022 Nobel Prize in Physics with Alain Aspect and John Clauser.
