id: john-von-neumann
name: John von Neumann
born: 1903
died: 1957
tradition: Hungarian-American mathematics
bio: >-
  Contributor to set theory, quantum mechanics, game theory, computer
  architecture and much else. In 1929 he isolated the property of a group that
  actually drives paradoxical decomposition — what is now called amenability —
  and thereby explained why the Banach–Tarski phenomenon appears in three
  dimensions but not in one or two.
