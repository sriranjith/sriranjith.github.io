id: eubulides-of-miletus
name: Eubulides of Miletus
tradition: Megarian school (4th century BCE)
bio: >-
  Megarian logician, a contemporary and critic of Aristotle. Diogenes Laertius
  credits him with a famous group of puzzles including the Liar, the Sorites (the
  heap), the Hooded Man and the Horned Man. He is the earliest person to whom the
  Liar paradox is attributed by any surviving source.
url: https://en.wikipedia.org/wiki/Eubulides
