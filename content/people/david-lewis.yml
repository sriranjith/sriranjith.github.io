id: david-lewis
name: David Lewis
born: 1941
died: 2001
tradition: American analytic philosophy
bio: >-
  One of the most influential analytic philosophers of the twentieth century,
  at Princeton from 1970. He is best known for modal realism, the counterfactual
  analysis of causation, and the Principal Principle linking chance to rational
  credence. His reply to Elga, published shortly before his death, is the
  canonical statement of the halfer position on Sleeping Beauty.
url: https://en.wikipedia.org/wiki/David_Lewis_(philosopher)
