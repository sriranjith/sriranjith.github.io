id: garrett-hardin
name: Garrett Hardin
born: 1915
died: 2003
tradition: American ecology and human ecology
bio: >-
  Professor of human ecology at the University of California, Santa Barbara. His
  1968 Science essay "The Tragedy of the Commons" became one of the most cited
  papers ever published in the journal. Hardin's stated purpose was to argue for
  coercive limits on population growth, and his later writing - including
  "Lifeboat Ethics" (1974) and work with anti-immigration organisations he helped
  found - is widely described by scholars as nativist and racist.
url: https://en.wikipedia.org/wiki/Garrett_Hardin
