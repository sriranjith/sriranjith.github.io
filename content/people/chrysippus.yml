id: chrysippus
name: Chrysippus of Soli
born: -279
died: -206
tradition: Stoicism
bio: >-
  Third head of the Stoa and the principal architect of Stoic logic. Diogenes
  Laertius' catalogue of his lost works lists at least six titles on the Liar,
  which makes him the first thinker known to have treated the paradox as a
  serious research programme rather than a debating trick.
url: https://en.wikipedia.org/wiki/Chrysippus
