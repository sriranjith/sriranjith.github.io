id: karl-menger
name: Karl Menger
born: 1902
died: 1985
tradition: Viennese mathematics
bio: >-
  Member of the Vienna Circle and a founder of dimension theory, later professor
  at Illinois Institute of Technology. His 1934 paper on uncertainty in value
  theory delivered the sharpest blow to the St Petersburg literature: for any
  unbounded utility function whatsoever, a "super-St-Petersburg" game can be
  built whose expected utility is again infinite. Bounded utility is therefore
  not a convenience but a requirement.
