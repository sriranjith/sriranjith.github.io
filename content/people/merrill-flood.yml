id: merrill-flood
name: Merrill M. Flood
born: 1908
died: 1991
tradition: American operations research
bio: >-
  Mathematician at the RAND Corporation and later the University of Michigan. In
  January 1950, with Melvin Dresher, he ran the experiment that first exhibited
  the game now called the Prisoner's Dilemma, and he published the results with
  the players' round-by-round commentary in 1958.
