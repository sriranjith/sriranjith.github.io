id: enrico-fermi
name: Enrico Fermi
born: 1901
died: 1954
tradition: Italian-American physics
bio: >-
  Architect of the first self-sustaining nuclear reactor and of the theory of
  beta decay, and famous for order-of-magnitude estimation from almost no data.
  Over lunch at Los Alamos in the summer of 1950 he interrupted a conversation
  about flying saucers to ask "Where is everybody?" — a question about the
  feasibility of interstellar travel that was later built into an argument he
  never published.
url: https://en.wikipedia.org/wiki/Enrico_Fermi
