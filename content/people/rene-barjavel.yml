id: rene-barjavel
name: René Barjavel
born: 1911
died: 1985
tradition: French science fiction and journalism
bio: >-
  French novelist, journalist and screenwriter. His 1943 novel "Le Voyageur
  Imprudent" ("The Imprudent Traveller") contains the scene generally credited
  with fixing the grandfather paradox in its now-standard form: a time traveller
  who kills his own ancestor. He later wrote "La Nuit des Temps" (1968) and
  worked on the screenplays of the "Don Camillo" films.
url: https://en.wikipedia.org/wiki/Ren%C3%A9_Barjavel
