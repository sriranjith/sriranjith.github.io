id: evangelista-torricelli
name: Evangelista Torricelli
born: 1608
died: 1647
tradition: Italian mathematics and physics
bio: >-
  Student and successor of Galileo, and inventor of the barometer. In 1641 he
  discovered that the solid of revolution obtained by rotating the curve y = 1/x
  around the x-axis from x = 1 to infinity has finite volume but infinite surface
  area — a result so counterintuitive that it generated immediate controversy.
  The shape is now called Gabriel's Horn or Torricelli's Trumpet. His work on
  indivisibles and infinitely extended solids contributed to the foundations of
  integral calculus.
url: https://en.wikipedia.org/wiki/Evangelista_Torricelli
