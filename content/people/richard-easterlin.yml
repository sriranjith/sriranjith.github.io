id: richard-easterlin
name: Richard Easterlin
born: 1926
tradition: American economic history and demography
bio: >-
  American economist at the University of Southern California, generally regarded
  as the founder of the economics of happiness. His 1974 chapter "Does Economic
  Growth Improve the Human Lot?" set out the tension between the cross-sectional
  and time-series relationships between income and reported wellbeing, and he has
  defended and refined the claim for fifty years. He is also known for the
  Easterlin hypothesis linking cohort size to fertility and relative economic
  fortune.
url: https://en.wikipedia.org/wiki/Richard_Easterlin
