id: david-hilbert
name: David Hilbert
born: 1862
died: 1943
tradition: German mathematics
bio: >-
  The dominant mathematician of his generation and the centre of gravity of
  Göttingen until the Nazi purges emptied it. His 1900 list of twenty-three
  problems set much of the century's agenda, and his defence of Cantor's
  transfinite mathematics — "no one shall expel us from the paradise that
  Cantor has created" — supplied both the formalist programme and the hotel
  that carries his name.
url: https://en.wikipedia.org/wiki/David_Hilbert
