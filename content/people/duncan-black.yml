id: duncan-black
name: Duncan Black
born: 1908
died: 1991
tradition: Scottish economics, public choice
bio: >-
  Scottish economist, usually credited as the founder of public choice theory.
  His 1948 paper "On the Rationale of Group Decision-making" introduced
  single-peaked preferences and the median voter result, showing exactly when
  majority rule is safe from Condorcet cycles. His 1958 book The Theory of
  Committees and Elections went back to the archives and recovered the work of
  Condorcet, Borda and Charles Dodgson for modern economics.
url: https://en.wikipedia.org/wiki/Duncan_Black
