id: stefan-banach
name: Stefan Banach
born: 1892
died: 1945
tradition: Lwów school of mathematics
bio: >-
  The founder of modern functional analysis and the central figure of the Lwów
  school, which did much of its work in the Scottish Café over a notebook of
  open problems. Banach spaces, the Hahn–Banach theorem and the Banach fixed
  point theorem all carry his name. He survived the German occupation feeding
  lice at Weigl's typhus institute and died of lung cancer in 1945.
