id: graham-priest
name: Graham Priest
born: 1948
tradition: Paraconsistent logic; dialetheism
bio: >-
  Logician at the CUNY Graduate Center, and the leading defender of dialetheism —
  the view that some contradictions are true. On his account the Liar sentence is
  both true and false, and the correct response is to give up the principle that
  a contradiction entails everything, rather than to restrict truth or
  self-reference.
