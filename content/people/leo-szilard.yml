id: leo-szilard
name: Leó Szilárd
born: 1898
died: 1964
tradition: Hungarian-American physics
bio: >-
  Physicist who conceived the nuclear chain reaction in 1933, drafted the letter
  Einstein sent to Roosevelt in 1939, and later campaigned against the weapons
  he had helped make possible. His 1929 paper on Maxwell's demon reduced the
  problem to a single-molecule engine and argued that the demon's act of
  acquiring information must itself generate entropy — the first quantitative
  link between information and thermodynamics.
url: https://en.wikipedia.org/wiki/Leo_Szilard
