id: amartya-sen
name: Amartya Sen
born: 1933
tradition: Indian economics and moral philosophy
bio: >-
  Indian economist and philosopher, awarded the 1998 Nobel Memorial Prize for
  work on welfare economics, social choice and famine. Collective Choice and
  Social Welfare (1970) mapped the escape routes from Arrow's theorem, showing
  that admitting interpersonal comparisons of welfare restores possibility. He
  also proved the impossibility of a Paretian liberal, and his capability
  approach reshaped how development is measured.
url: https://en.wikipedia.org/wiki/Amartya_Sen
