id: zeno-of-elea
name: Zeno of Elea
born: -490
died: -430
tradition: Eleatic philosophy (Greek, southern Italy)
bio: >-
  Pupil and associate of Parmenides in the Greek colony of Elea. He wrote a
  single book of arguments designed to show that the pluralist common-sense
  picture of the world is more absurd than his teacher's claim that reality is
  one and changeless. None of the book survives intact; the motion paradoxes are
  known only through Aristotle's paraphrases and later commentary.
url: https://en.wikipedia.org/wiki/Zeno_of_Elea
