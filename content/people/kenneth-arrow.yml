id: kenneth-arrow
name: Kenneth Arrow
born: 1921
died: 2017
tradition: American mathematical economics
bio: >-
  American economist whose Columbia doctoral dissertation, published in 1951 as
  Social Choice and Individual Values, proved that no method of aggregating
  ranked preferences can satisfy four elementary conditions at once. He went on
  to co-author the Arrow–Debreu proof of the existence of general equilibrium and
  to found modern health economics and the economics of information. He shared
  the 1972 Nobel Memorial Prize with John Hicks and, at 51, remains the youngest
  economics laureate.
url: https://en.wikipedia.org/wiki/Kenneth_Arrow
