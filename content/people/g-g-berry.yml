id: g-g-berry
name: G. G. Berry
born: 1867
died: 1928
tradition: English amateur logic
bio: >-
  George Godfrey Berry, a junior librarian at the Bodleian Library in Oxford. He
  corresponded with Bertrand Russell and sent him the puzzle about the least
  integer not nameable in a small number of syllables. Russell published it in
  1906 with explicit credit to Berry, and it has carried his name ever since. He
  published almost nothing under his own name.
url: https://en.wikipedia.org/wiki/Berry_paradox
