id: sheldon-ross
name: Sheldon Ross
born: 1943
tradition: American applied probability and statistics
bio: >-
  Probabilist and author of widely used textbooks in probability and stochastic
  processes. His name is attached to the Ross-Littlewood paradox, a supertask
  thought experiment about a vase and numbered balls, which he popularised as a
  vehicle for exploring the mathematics of infinite sets and the limits of
  classical notions of convergence. His textbooks, including A First Course in
  Probability, have introduced the subject to generations of students.
url: https://en.wikipedia.org/wiki/Sheldon_Ross
