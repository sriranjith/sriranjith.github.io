id: hans-moravec
name: Hans Moravec
born: 1948
tradition: Robotics and artificial intelligence
bio: >-
  Austrian-born roboticist, long at the Carnegie Mellon Robotics Institute, known
  for early autonomous vehicle navigation and for forecasts of machine
  capability. His 1988 book Mind Children states the observation that carries his
  name: reasoning is computationally cheap, perception and mobility are
  extraordinarily expensive.
url: https://en.wikipedia.org/wiki/Hans_Moravec
