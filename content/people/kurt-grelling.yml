id: kurt-grelling
name: Kurt Grelling
born: 1886
died: 1942
tradition: German logic and philosophy
bio: >-
  German philosopher and logician, student of David Hilbert and Leonard Nelson.
  In 1908 he and Nelson jointly published the paradox that bears their names: the
  Grelling-Nelson paradox, which shows that the ordinary notion of a word
  describing itself generates the same kind of contradiction that Russell found
  in naive set theory. Grelling was Jewish and was murdered at Auschwitz in 1942.
url: https://en.wikipedia.org/wiki/Kurt_Grelling
