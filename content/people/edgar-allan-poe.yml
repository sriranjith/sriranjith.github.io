id: edgar-allan-poe
name: Edgar Allan Poe
born: 1809
died: 1849
tradition: American letters
bio: >-
  Poet, critic and inventor of the detective story. In his last major work,
  Eureka: A Prose Poem (1848), he set out a speculative cosmology and, in a
  single celebrated passage, gave the correct shape of the answer to the dark
  night sky: the void between the stars exists because light from the most
  distant of them has not yet had time to reach us. He offered it as intuition
  rather than physics, and it was ignored for a century.
url: https://en.wikipedia.org/wiki/Edgar_Allan_Poe
