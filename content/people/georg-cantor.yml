id: georg-cantor
name: Georg Cantor
born: 1845
died: 1918
tradition: German mathematics
bio: >-
  Born in Saint Petersburg, professor at Halle for his entire career, and the
  creator of set theory. He proved that infinite sets come in different sizes,
  invented the transfinite cardinals and ordinals, and defended the completed
  infinite against fierce opposition — most bitterly from his former teacher
  Leopold Kronecker. He suffered recurrent depression from 1884 and died in a
  sanatorium in Halle.
url: https://en.wikipedia.org/wiki/Georg_Cantor
