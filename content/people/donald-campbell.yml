id: donald-campbell
name: Donald T. Campbell
born: 1916
died: 1996
tradition: American social psychology and methodology
bio: >-
  American social scientist who did foundational work on research design,
  validity and evaluation. His writing on planned social change gave the
  corruption of social indicators its sharpest independent statement, now known
  as Campbell's Law.
url: https://en.wikipedia.org/wiki/Donald_T._Campbell
