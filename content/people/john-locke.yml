id: john-locke
name: John Locke
born: 1632
died: 1704
tradition: English empiricism
bio: >-
  English philosopher and physician. The chapter "Of Identity and Diversity",
  added to the second edition of his Essay Concerning Human Understanding in
  1694, separated the identity of a person from the identity of a man and of a
  substance, and grounded personal identity in continuity of consciousness. Every
  later psychological-continuity theory is a descendant of that chapter.
