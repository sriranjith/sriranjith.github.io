id: lewis-fry-richardson
name: Lewis Fry Richardson
born: 1881
died: 1953
tradition: British mathematics, meteorology, and peace studies
bio: >-
  Mathematician and meteorologist who pioneered numerical weather prediction and
  the mathematical study of the causes of war. While studying the relationship
  between shared border length and likelihood of conflict, he noticed that the
  reported length of borders between countries varied wildly depending on the
  source — because different maps used different scales. His posthumous paper
  on this observation, published in 1961, laid the groundwork for what Benoit
  Mandelbrot later formalised as the coastline paradox and fractal geometry.
