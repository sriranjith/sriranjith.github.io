id: baruch-spinoza
name: Baruch Spinoza
born: 1632
died: 1677
tradition: Dutch rationalism
bio: >-
  Dutch philosopher and lens-grinder. In the scholium to Ethics II.49 he takes up
  the man suspended in perfect equilibrium and simply concedes the point: such a
  person would indeed die of hunger and thirst, and should be reckoned an ass
  rather than a man. He uses the case to attack the idea of a free-floating
  faculty of will.
