id: robert-solow
name: Robert Solow
born: 1924
died: 2023
tradition: American macroeconomics
bio: >-
  MIT economist and 1987 Nobel laureate whose growth model made technological
  progress the central driver of long-run output. A single aside in a 1987 book
  review — that the computer age was visible everywhere except in the
  productivity statistics — named the productivity paradox.
url: https://en.wikipedia.org/wiki/Robert_Solow
