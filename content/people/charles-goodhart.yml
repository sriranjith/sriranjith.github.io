id: charles-goodhart
name: Charles Goodhart
born: 1936
tradition: British monetary economics
bio: >-
  British economist, for many years an adviser at the Bank of England and later
  professor at the London School of Economics. In a 1975 conference paper on UK
  monetary management he observed that any statistical regularity tends to
  collapse once it is used as an instrument of control — the remark that became
  Goodhart's Law.
url: https://en.wikipedia.org/wiki/Charles_Goodhart
