id: felix-hausdorff
name: Felix Hausdorff
born: 1868
died: 1942
tradition: German mathematics
bio: >-
  Founder of modern point-set topology and of measure and dimension theory. His
  1914 paradoxical decomposition of the sphere minus a countable set is the
  direct ancestor of the Banach–Tarski theorem. Persecuted as a Jew under the
  Nazi regime and facing internment, he took his own life with his wife and her
  sister in Bonn in January 1942.
url: https://en.wikipedia.org/wiki/Felix_Hausdorff
