id: nicolas-de-condorcet
name: Nicolas de Condorcet
born: 1743
died: 1794
tradition: French Enlightenment mathematics and philosophy
bio: >-
  Marie Jean Antoine Nicolas de Caritat, Marquis de Condorcet: mathematician,
  permanent secretary of the Académie royale des sciences, and the last of the
  philosophes. His 1785 Essai applied probability theory to voting and juries,
  producing both the jury theorem and the cycle that bears his name. He was an
  early opponent of slavery and an advocate of women's suffrage, sat in the
  Legislative Assembly, and voted against executing the king. Proscribed during
  the Terror, he wrote his Esquisse d'un tableau historique des progrès de
  l'esprit humain while in hiding, and was found dead in a cell at Bourg-la-Reine
  in March 1794.
url: https://en.wikipedia.org/wiki/Marquis_de_Condorcet
