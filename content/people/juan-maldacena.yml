id: juan-maldacena
name: Juan Maldacena
born: 1968
tradition: Argentine-American theoretical physics
bio: >-
  Argentine physicist at the Institute for Advanced Study whose 1997 conjecture
  relating string theory in anti-de Sitter space to a conformal field theory on
  its boundary (AdS/CFT) is the most-cited result in modern theoretical physics.
  It supplies the sharpest existing argument that black hole evaporation is
  unitary, because the boundary theory is manifestly so.
