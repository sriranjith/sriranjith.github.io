id: charles-thomas
name: Charles A. Thomas Jr.
born: 1927
died: 2015
tradition: American molecular biology
bio: >-
  American molecular biologist who worked on the physical organisation of
  chromosomal DNA. His 1971 review in the Annual Review of Genetics named the
  C-value paradox: the amount of DNA in a genome bears no reliable relation to
  the apparent complexity of the organism carrying it.
