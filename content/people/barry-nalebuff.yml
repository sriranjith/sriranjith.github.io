id: barry-nalebuff
name: Barry Nalebuff
born: 1958
tradition: American game theory and management
bio: >-
  Professor at the Yale School of Management, co-author of "Thinking
  Strategically" and "Co-opetition", and later co-founder of the drinks company
  Honest Tea. From 1987 to 1990 he wrote the Puzzles column in the Journal of
  Economic Perspectives; his 1989 instalment recast an old exchange paradox in
  terms of two envelopes and gave the problem the form it now has.
url: https://en.wikipedia.org/wiki/Barry_Nalebuff
