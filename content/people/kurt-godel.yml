id: kurt-godel
name: Kurt Gödel
born: 1906
died: 1978
tradition: Austrian-American mathematical logic
bio: >-
  Logician of the first rank. He proved the completeness of first-order logic
  (1929), then in 1931 the two incompleteness theorems that ended Hilbert's
  programme in its original form. He later proved the consistency of the
  continuum hypothesis and the axiom of choice with ZF (1938-40). A Platonist
  about mathematical truth, he resisted the subjectivist readings his theorems
  are still routinely given.
url: https://plato.stanford.edu/entries/goedel/
