id: plutarch
name: Plutarch
born: 46
died: 119
tradition: Greek biography and Middle Platonism
bio: >-
  Greek historian, biographer and priest at Delphi. His Parallel Lives pairs
  Greek and Roman figures. Chapter 23 of the Life of Theseus records the ship
  preserved by the Athenians and notes that philosophers already used it as a
  standing example in disputes about growth and identity — making Plutarch a
  reporter of the puzzle rather than its inventor.
url: https://en.wikipedia.org/wiki/Plutarch
