id: marvin-minsky
name: Marvin Minsky
born: 1927
died: 2016
tradition: American artificial intelligence
bio: >-
  Co-founder of the MIT Artificial Intelligence Laboratory and one of the
  founding figures of the field. In The Society of Mind he argued that the mental
  work we find easiest is the work built from the largest and oldest machinery,
  which is exactly why it is hardest to introspect on and hardest to reproduce.
url: https://en.wikipedia.org/wiki/Marvin_Minsky
