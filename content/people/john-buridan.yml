id: john-buridan
name: John Buridan
born: 1300
died: 1361
tradition: Fourteenth-century Parisian nominalism
bio: >-
  Jean Buridan was a secular master of arts at the University of Paris, twice its
  rector, and the most influential logician of his century. He held that the will
  can defer choice when the intellect finds no decisive reason either way. The
  starving donkey attached to his name appears nowhere in his surviving writings;
  it is a caricature aimed at that doctrine by later critics. His birth and death
  dates are both approximate.
url: https://plato.stanford.edu/entries/buridan/
