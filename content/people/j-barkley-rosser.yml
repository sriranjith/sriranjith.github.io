id: j-barkley-rosser
name: J. Barkley Rosser
born: 1907
died: 1989
tradition: American mathematical logic
bio: >-
  American logician, a student of Alonzo Church. In 1936 he strengthened Gödel's
  first incompleteness theorem by replacing the hypothesis of omega-consistency
  with plain consistency, using a cleverly modified self-referential sentence now
  called the Rosser sentence. The Kleene-Rosser paradox and the Church-Rosser
  theorem also bear his name.
