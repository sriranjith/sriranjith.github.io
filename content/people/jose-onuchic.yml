id: jose-onuchic
name: José Onuchic
born: 1958
tradition: Theoretical biophysics
bio: >-
  Brazilian-American physicist at Rice University who, with Wolynes, Nymeyer and
  Socci, developed the energy landscape theory of folding and coined the language
  of the folding funnel that is now standard in the field.
