id: steven-pinker
name: Steven Pinker
born: 1954
tradition: Cognitive psychology and psycholinguistics
bio: >-
  Canadian-American cognitive scientist at MIT and later Harvard. In The Language
  Instinct (1994) he gave Moravec's observation its most quoted formulation: the
  hard problems of artificial intelligence turned out to be easy, and the easy
  ones — recognising a face, crossing a room — turned out to be hard.
