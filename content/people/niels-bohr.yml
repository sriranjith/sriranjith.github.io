id: niels-bohr
name: Niels Bohr
born: 1885
died: 1962
tradition: Danish theoretical physics
bio: >-
  Danish physicist, Nobel laureate of 1922, and the central figure of what
  became known as the Copenhagen interpretation. His institute in Copenhagen
  trained much of the founding generation of quantum theory. His doctrine of
  complementarity — that a quantum system's description depends irreducibly on
  the experimental arrangement used to probe it — was his standing reply to
  Einstein, including his same-titled 1935 rebuttal of the EPR argument.
url: https://en.wikipedia.org/wiki/Niels_Bohr
