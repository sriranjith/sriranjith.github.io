id: joseph-polchinski
name: Joseph Polchinski
born: 1954
died: 2018
tradition: American theoretical physics
bio: >-
  Santa Barbara string theorist who discovered D-branes (1995), a result that
  made the microscopic counting of black hole entropy possible. With Ahmed
  Almheiri, Donald Marolf and James Sully he formulated the 2012 firewall
  argument, showing that black hole complementarity, the equivalence principle
  and unitarity cannot all be true at once.
