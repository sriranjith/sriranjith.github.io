id: james-fowler
name: James H. Fowler
born: 1970
tradition: American political science and network science
bio: >-
  Political scientist at the University of California, San Diego, working on
  social networks, behaviour spread and the genetics of political participation.
  With Nicholas Christakis he co-authored the 2010 study that used friends of
  randomly chosen students as early sensors for an influenza outbreak.
url: https://en.wikipedia.org/wiki/James_H._Fowler
