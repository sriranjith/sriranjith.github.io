id: michael-hart
name: Michael H. Hart
born: 1932
tradition: American astrophysics
bio: >-
  Astrophysicist whose 1975 paper in the Quarterly Journal of the Royal
  Astronomical Society gave the first rigorous form of the modern argument:
  starting from plausible colonisation speeds, the Galaxy should have been
  settled long ago, so the absence of extraterrestrials on Earth is itself
  evidence about their existence. He also did early work on the habitable zones
  of planetary systems.
url: https://en.wikipedia.org/wiki/Michael_H._Hart
