id: robin-hanson
name: Robin Hanson
born: 1959
tradition: American economics and futures studies
bio: >-
  Economist at George Mason University, known for prediction markets, futarchy,
  and The Age of Em. His 1998 essay "The Great Filter" reframed the Fermi
  question as a search for the improbable step between dead matter and a visible
  interstellar civilisation, and pointed out the uncomfortable corollary: the
  more easily life arises, the more likely the filter lies ahead of us.
url: https://en.wikipedia.org/wiki/Robin_Hanson
