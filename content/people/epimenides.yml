id: epimenides
name: Epimenides of Knossos
tradition: Archaic Cretan seer and poet (semi-legendary)
bio: >-
  A Cretan poet and purifier of the seventh or sixth century BCE, surrounded by
  legend — including a fifty-seven-year sleep in a cave. A line attributed to him,
  "Cretans are always liars", is quoted in the Epistle to Titus and is the reason
  his name is attached to the Liar paradox. He almost certainly never intended it
  as a paradox, and it is not one.
url: https://en.wikipedia.org/wiki/Epimenides
