id: erasto-mpemba
name: Erasto Mpemba
born: 1950
tradition: Tanzanian student and science communicator
bio: >-
  Tanzanian schoolboy who, in 1963, noticed that hot ice-cream mixture froze
  faster than cold mixture when placed in the same freezer. His physics teacher
  dismissed the observation, but when physicist Denis Osborne visited the school
  in 1966, Mpemba asked him about it directly. Osborne confirmed the effect
  experimentally and co-authored the 1969 paper introducing it to the scientific
  literature — with Mpemba's name first on the byline, an unusual acknowledgment
  for a student. The effect now bears his name.
url: https://en.wikipedia.org/wiki/Mpemba_effect
