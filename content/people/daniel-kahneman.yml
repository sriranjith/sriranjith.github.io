id: daniel-kahneman
name: Daniel Kahneman
born: 1934
died: 2024
tradition: Israeli-American cognitive psychology
bio: >-
  Psychologist whose collaboration with Amos Tversky produced the
  heuristics-and-biases programme and, in 1979, prospect theory — the model that
  turned the Allais paradox from an anomaly into the foundation of behavioural
  economics. He was awarded the 2002 Nobel Memorial Prize in Economic Sciences,
  which Tversky did not live to share. His later work covered experienced versus
  remembered wellbeing, and he ended his career championing adversarial
  collaboration as a way to settle scientific disputes.
url: https://en.wikipedia.org/wiki/Daniel_Kahneman
