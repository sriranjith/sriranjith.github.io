id: john-stewart-bell
name: John Stewart Bell
born: 1928
died: 1990
tradition: Northern Irish theoretical physics
bio: >-
  Belfast-born physicist who spent most of his career at CERN doing accelerator
  and particle theory, and pursued quantum foundations as what he called his
  "hobby". His 1964 paper turned Einstein's philosophical complaint into an
  inequality that experiments could test, and his 1966 review dismantled von
  Neumann's supposed proof that hidden variables were impossible. He died of a
  stroke in 1990, the year he had been nominated for a Nobel Prize.
url: https://en.wikipedia.org/wiki/John_Stewart_Bell
