id: joseph-bertrand
name: Joseph Bertrand
born: 1822
died: 1900
tradition: French mathematics
bio: >-
  Professor at the École Polytechnique and the Collège de France, and permanent
  secretary of the Académie des Sciences. He is remembered for Bertrand's
  postulate on prime numbers, for the Bertrand model of price competition in
  economics, and for two quite different paradoxes in his 1889 "Calcul des
  probabilités" — the box paradox, and the random-chord paradox that showed
  "at random" is not a well-defined instruction.
url: https://en.wikipedia.org/wiki/Joseph_Bertrand
