id: igor-novikov
name: Igor Novikov
born: 1935
tradition: Russian theoretical astrophysics
bio: >-
  Russian astrophysicist known for work on black holes and cosmology, and for
  the self-consistency principle that bears his name: if closed timelike curves
  exist, the only physical processes on them are those whose local solutions are
  globally consistent, so that paradoxical histories simply have probability
  zero. He collaborated with Kip Thorne's Caltech group on the physics of time
  machines in the late 1980s and 1990s.
url: https://en.wikipedia.org/wiki/Igor_Dmitriyevich_Novikov
