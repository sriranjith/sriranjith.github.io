id: protagoras
name: Protagoras of Abdera
born: -490
died: -420
tradition: Greek sophistic movement
bio: >-
  The first and most celebrated of the sophists, and by ancient report the first
  man to charge a fee for teaching. He is remembered for "man is the measure of
  all things", for professing agnosticism about the gods, and for training
  students to argue either side of any case — a skill that, in the Paradox of the
  Court, is turned against him by his own pupil.
url: https://en.wikipedia.org/wiki/Protagoras
