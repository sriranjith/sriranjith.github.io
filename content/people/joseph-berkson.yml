id: joseph-berkson
name: Joseph Berkson
born: 1899
died: 1982
tradition: American medical statistics
bio: >-
  Physician and statistician, head of the division of biometry and medical
  statistics at the Mayo Clinic for three decades. He coined the term "logit",
  argued at length against the causal interpretation of the early smoking–cancer
  studies, and in 1946 described the selection artefact in hospital data that now
  bears his name.
url: https://en.wikipedia.org/wiki/Joseph_Berkson
