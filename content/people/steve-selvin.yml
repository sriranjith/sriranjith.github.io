id: steve-selvin
name: Steve Selvin
born: 1941
tradition: American biostatistics
bio: >-
  Professor of biostatistics at the University of California, Berkeley. In 1975
  he wrote the short letter to The American Statistician that first posed, and
  then named, the Monty Hall problem.
