id: melvin-dresher
name: Melvin Dresher
born: 1911
died: 1992
tradition: Polish-American mathematics and game theory
bio: >-
  Mathematician at the RAND Corporation, where he worked on the application of
  game theory to military strategy. With Merrill Flood he devised the two-player
  game whose structure Albert Tucker later dressed in the story of two prisoners.
url: https://en.wikipedia.org/wiki/Melvin_Dresher
