id: nicolaus-bernoulli
name: Nicolaus Bernoulli
born: 1687
died: 1759
tradition: Swiss mathematics
bio: >-
  Nicolaus I Bernoulli, professor at Basel and a nephew of Jacob and Johann
  Bernoulli. He worked mainly through correspondence, and it is a letter that
  earns him his place here: writing to Pierre Rémond de Montmort on 9 September
  1713, he proposed the coin-doubling wager whose expected value is infinite.
  He never published a resolution of it himself.
url: https://en.wikipedia.org/wiki/Nicolaus_I_Bernoulli
