id: ken-dill
name: Ken A. Dill
born: 1947
tradition: Biophysical chemistry
bio: >-
  American biophysical chemist at Stony Brook University, known for lattice
  models of folding and for the hydrophobic account of what drives a chain to
  collapse. His 1997 review with Hue Sun Chan, "From Levinthal to pathways to
  funnels", set out the funnel picture for a general audience.
