id: roy-sorensen
name: Roy Sorensen
tradition: American analytic philosophy
bio: >-
  Philosopher at the University of Texas at Austin, and the author of the
  Stanford Encyclopedia entries on vagueness and on epistemic paradoxes. His book
  Blindspots (1988) introduced the idea of a proposition that is true but cannot
  consistently be believed by a particular person — which is exactly what the
  judge's sentence is for the condemned prisoner. He also defends epistemicism
  about vagueness.
url: https://en.wikipedia.org/wiki/Roy_Sorensen
