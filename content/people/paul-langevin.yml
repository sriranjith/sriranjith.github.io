id: paul-langevin
name: Paul Langevin
born: 1872
died: 1946
tradition: French theoretical and experimental physics
bio: >-
  Professor at the Collège de France, known for the Langevin equation, the
  theory of paramagnetism and the invention of ultrasonic echo-ranging. At the
  1911 philosophy congress in Bologna he described a traveller who leaves Earth
  at high speed and returns to find that far more time has passed at home than
  aboard the ship — the thought experiment now called the twin paradox, though
  Langevin never mentioned twins.
url: https://en.wikipedia.org/wiki/Paul_Langevin
