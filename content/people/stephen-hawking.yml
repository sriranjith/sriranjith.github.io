id: stephen-hawking
name: Stephen Hawking
born: 1942
died: 2018
tradition: British theoretical physics
bio: >-
  Cambridge theorist who, with Roger Penrose, proved the singularity theorems of
  general relativity, and who then showed in 1974–75 that black holes radiate and
  therefore have a temperature. He spent the following three decades arguing —
  first for, then against — the conclusion that this radiation destroys
  information. Diagnosed with motor neurone disease at 21, he worked for more than
  fifty years afterwards and wrote "A Brief History of Time" (1988).
url: https://en.wikipedia.org/wiki/Stephen_Hawking
