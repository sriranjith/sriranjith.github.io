id: dietrich-braess
name: Dietrich Braess
born: 1938
tradition: German mathematics
bio: >-
  Mathematician at the Ruhr University Bochum, best known for numerical analysis
  and the finite element method. In a 1968 paper on traffic planning he showed
  that adding a new road to a congested network can increase everyone's travel
  time once drivers re-optimise - the effect now universally called Braess's
  paradox.
