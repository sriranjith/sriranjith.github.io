id: ole-peters
name: Ole Peters
tradition: Ergodicity economics
bio: >-
  Physicist at the London Mathematical Laboratory and the Santa Fe Institute,
  and the leading advocate of "ergodicity economics". His 2011 paper argues that
  the St Petersburg paradox — and much of decision theory besides — arises from
  quietly substituting an average over parallel possible worlds for an average
  over time in a single world, two quantities that coincide only for ergodic
  processes. Wealth dynamics are not ergodic.
