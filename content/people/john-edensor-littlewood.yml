id: john-edensor-littlewood
name: John Edensor Littlewood
born: 1885
died: 1977
tradition: English analysis
bio: >-
  Cambridge analyst, and for thirty-five years G. H. Hardy's collaborator on the
  distribution of primes, Waring's problem and Fourier analysis. His 1953
  collection "A Mathematician's Miscellany" preserves, in a few lines, a card
  version of the exchange paradox that he credits to Erwin Schrödinger — one of
  the earliest records of the two envelopes argument.
