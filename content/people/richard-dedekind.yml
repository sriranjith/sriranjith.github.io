id: richard-dedekind
name: Richard Dedekind
born: 1831
died: 1916
tradition: German mathematics
bio: >-
  Braunschweig mathematician, the last doctoral student of Gauss, and one of the
  architects of modern foundations. In Was sind und was sollen die Zahlen?
  (1888) he turned Galileo's embarrassment into a definition: a set is infinite
  precisely when it can be matched one-for-one with a proper part of itself.
url: https://en.wikipedia.org/wiki/Richard_Dedekind
