id: george-gamow
name: George Gamow
born: 1904
died: 1968
tradition: Russian-American theoretical physics
bio: >-
  Physicist and cosmologist — quantum tunnelling in alpha decay, Big Bang
  nucleosynthesis, early work on the genetic code — and one of the great
  popularisers of science. His One Two Three... Infinity (1947) carried
  Hilbert's hotel, and much of Cantor's transfinite arithmetic, to a general
  readership for the first time.
