id: thomas-hobbes
name: Thomas Hobbes
born: 1588
died: 1679
tradition: English early modern philosophy
bio: >-
  English philosopher, best known for Leviathan. In De Corpore (1655) he sharpened
  the Ship of Theseus into its modern form by imagining a second ship rebuilt from
  the discarded planks, and observed that treating both as the original would give
  you two bodies numerically the same, which he called absurd.
