id: peter-unger
name: Peter Unger
tradition: American analytic philosophy
bio: >-
  Philosopher at New York University. In a run of papers around 1979 he pressed
  the sorites in the direction almost everyone else refuses to go, concluding
  that ordinary terms such as "stone" and "table" are incoherent and that there
  are no ordinary things — and, in a companion paper, no people either.
