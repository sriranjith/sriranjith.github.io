id: benoit-mandelbrot
name: Benoit Mandelbrot
born: 1924
died: 2010
tradition: Polish-French-American mathematics
bio: >-
  Mathematician who created the field of fractal geometry. His 1967 paper "How
  Long Is the Coast of Britain?" — a direct response to Lewis Fry Richardson's
  observations — introduced the idea that coastlines and similar irregular
  curves have no well-defined length and can be characterised by a non-integer
  fractal dimension. He went on to show that fractals appear throughout nature:
  in snowflakes, lightning bolts, mountain ranges, and financial markets. The
  Mandelbrot set, the most famous object in fractal geometry, bears his name.
url: https://en.wikipedia.org/wiki/Benoit_Mandelbrot
