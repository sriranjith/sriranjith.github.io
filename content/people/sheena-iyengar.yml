id: sheena-iyengar
name: Sheena Iyengar
born: 1969
tradition: American social psychology and management
bio: >-
  Professor at Columbia Business School. With Mark Lepper she ran the 2000 field
  study in a California grocery store in which a display of 24 jams drew more
  passers-by but produced far fewer purchases than a display of 6 - the single
  most cited piece of evidence for choice overload, and one that later
  replication attempts and meta-analyses have not reliably reproduced.
url: https://en.wikipedia.org/wiki/Sheena_Iyengar
