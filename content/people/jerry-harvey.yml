id: jerry-harvey
name: Jerry B. Harvey
born: 1935
died: 2015
tradition: American organisational behaviour
bio: >-
  Professor of management science at George Washington University. His 1974
  article "The Abilene Paradox: The Management of Agreement" opened with a true
  story about his own family driving fifty-three miles to Abilene, Texas, on a
  July afternoon that none of them wanted, and used it to argue that
  organisations fail at least as often from mismanaged agreement as from
  mismanaged conflict.
url: https://en.wikipedia.org/wiki/Abilene_paradox
