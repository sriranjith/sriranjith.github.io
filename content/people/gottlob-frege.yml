id: gottlob-frege
name: Gottlob Frege
born: 1848
died: 1925
tradition: German logic and philosophy of mathematics
bio: >-
  Inventor of modern quantificational logic and the founder of logicism, the
  programme of deriving arithmetic from logic alone. His Grundgesetze der
  Arithmetik rested on Basic Law V, which Russell's 1902 letter showed to be
  inconsistent. Frege appended a candid acknowledgement to the second volume and
  eventually abandoned the logicist project.
url: https://plato.stanford.edu/entries/frege/
