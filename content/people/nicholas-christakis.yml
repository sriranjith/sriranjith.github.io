id: nicholas-christakis
name: Nicholas A. Christakis
born: 1962
tradition: American sociology and medicine
bio: >-
  Physician and social scientist at Yale, director of the Human Nature Lab. With
  James Fowler he studied how behaviours and states — obesity, smoking, happiness
  — propagate through social networks, and turned the friendship paradox into a
  practical instrument for detecting outbreaks before they show up in population
  surveillance.
