id: martin-gardner
name: Martin Gardner
born: 1914
died: 2010
tradition: American recreational mathematics and popular science
bio: >-
  Author of the Mathematical Games column in Scientific American from 1956 to
  1981, and of more than seventy books. His 1963 column and the 1969 collection
  named after it, The Unexpected Hanging and Other Mathematical Diversions,
  carried the prediction paradox from a narrow philosophy journal debate to a
  general readership.
