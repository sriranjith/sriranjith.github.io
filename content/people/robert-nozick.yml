id: robert-nozick
name: Robert Nozick
born: 1938
died: 2002
tradition: American analytic philosophy
bio: >-
  Harvard philosopher best known for Anarchy, State, and Utopia (1974), a
  libertarian counterpoint to Rawls. In 1969 he published the paper that
  introduced Newcomb's Problem to academic philosophy, framing the tension
  between two apparently compelling decision principles and declining to
  adjudicate between them. He subsequently championed evidential decision theory,
  though he acknowledged the opposing argument's force throughout his career.
