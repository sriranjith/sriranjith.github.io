id: derek-parfit
name: Derek Parfit
born: 1942
died: 2017
tradition: British analytic philosophy and ethics
bio: >-
  Philosopher at All Souls College, Oxford. Reasons and Persons (1984) argued
  through fission and teletransportation cases that questions of personal
  identity can be empty, and that what matters in survival is psychological
  continuity and connectedness rather than identity itself.
