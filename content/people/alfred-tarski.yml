id: alfred-tarski
name: Alfred Tarski
born: 1901
died: 1983
tradition: Polish logic; later Berkeley
bio: >-
  Logician and mathematician, born in Warsaw, from 1942 at Berkeley. He gave the
  modern semantic definition of truth and proved the undefinability of truth
  within a formal system. His first major result, with Banach in 1924, was the
  paradoxical decomposition of the ball — work he began as a doctoral student of
  Leśniewski.
url: https://en.wikipedia.org/wiki/Alfred_Tarski
