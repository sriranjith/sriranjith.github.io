id: erik-brynjolfsson
name: Erik Brynjolfsson
born: 1962
tradition: Economics of information technology
bio: >-
  American economist, long at MIT and later director of the Digital Economy Lab
  at Stanford. His firm-level work with Lorin Hitt showed that the returns to
  computing were real but arrived only alongside organisational change, and his
  later "productivity J-curve" applies the same argument to artificial
  intelligence.
url: https://en.wikipedia.org/wiki/Erik_Brynjolfsson
