id: maurice-allais
name: Maurice Allais
born: 1911
died: 2010
tradition: French mathematical economics
bio: >-
  French economist, engineer and physicist, awarded the 1988 Nobel Memorial Prize
  for his work on market equilibrium and the efficient use of resources. Much of
  his most original work — on capital theory, on monetary dynamics, and on choice
  under risk — was published only in French and reached the Anglophone mainstream
  decades late. In 1952 he put the questionnaire now known as the Allais paradox
  to a room of leading decision theorists, and spent the following decades
  arguing that expected utility theory was not a defensible account of rational
  choice.
