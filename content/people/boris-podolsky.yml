id: boris-podolsky
name: Boris Podolsky
born: 1896
died: 1966
tradition: Russian-American theoretical physics
bio: >-
  Born in Taganrog, emigrated to the United States in 1913, and worked with
  Einstein at the Institute for Advanced Study in Princeton. He wrote the actual
  text of the 1935 EPR paper. Einstein later complained privately that the
  argument had been "smothered by the formalism" in Podolsky's drafting, and
  restated it in his own simpler terms in subsequent years.
url: https://en.wikipedia.org/wiki/Boris_Podolsky
