id: richard-von-mises
name: Richard von Mises
born: 1883
died: 1953
tradition: Austrian applied mathematics and probability
bio: >-
  Applied mathematician who worked on aerodynamics, plasticity and numerical
  analysis, and who built one of the twentieth century's two great foundations
  for probability — the frequentist theory of the "Kollektiv", the rival to
  Kolmogorov's axiomatic approach. Dismissed from Berlin in 1933, he taught in
  Istanbul and then at Harvard. His 1939 Istanbul paper on occupancy
  probabilities contains the first published treatment of the birthday problem.
url: https://en.wikipedia.org/wiki/Richard_von_Mises
