id: diogenes-laertius
name: Diogenes Laertius
tradition: Greek doxography (3rd century CE)
bio: >-
  Compiler of the Lives and Opinions of Eminent Philosophers, ten books of
  biography, gossip, book lists and quotation. He is an uneven historian and a
  priceless one: for many ancient thinkers, including Eubulides and much of the
  Stoa, his catalogue is the only reason we know what they wrote about.
url: https://en.wikipedia.org/wiki/Diogenes_La%C3%ABrtius
