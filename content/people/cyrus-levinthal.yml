id: cyrus-levinthal
name: Cyrus Levinthal
born: 1922
died: 1990
tradition: Molecular biology and biophysics
bio: >-
  American molecular biologist at MIT and later Columbia, and a pioneer of
  interactive computer graphics for molecules. In 1968–69 he pointed out that a
  protein searching its conformations at random could not fold in the age of the
  universe, yet real proteins fold in microseconds.
url: https://en.wikipedia.org/wiki/Cyrus_Levinthal
