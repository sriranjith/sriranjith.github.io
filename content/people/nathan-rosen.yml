id: nathan-rosen
name: Nathan Rosen
born: 1909
died: 1995
tradition: American-Israeli theoretical physics
bio: >-
  Einstein's assistant at Princeton in the mid-1930s and the third author of the
  1935 EPR paper. With Einstein he also produced the Einstein–Rosen bridge
  (1935), the first wormhole solution in general relativity. He later helped
  found the physics department at the Technion in Haifa.
