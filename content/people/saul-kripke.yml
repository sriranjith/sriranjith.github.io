id: saul-kripke
name: Saul Kripke
born: 1940
died: 2022
tradition: American analytic philosophy and modal logic
bio: >-
  Logician and philosopher, best known for the possible-worlds semantics of modal
  logic and for Naming and Necessity. His 1975 paper "Outline of a Theory of
  Truth" replaced Tarski's hierarchy of languages with a single language whose
  truth predicate is partial, built up to a fixed point — the most influential
  technical response to the Liar in the twentieth century.
