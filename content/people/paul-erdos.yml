id: paul-erdos
name: Paul Erdős
born: 1913
died: 1996
tradition: Hungarian mathematics
bio: >-
  One of the most prolific mathematicians in history, with around 1,500 papers
  and a famously itinerant life. He appears here for a humbling reason: he
  reportedly refused to accept the Monty Hall answer until shown a simulation.
