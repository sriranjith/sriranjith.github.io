id: kit-fine
name: Kit Fine
born: 1946
tradition: British-American analytic philosophy and metaphysics
bio: >-
  Silver Professor of Philosophy at New York University. His 1975 paper
  "Vagueness, Truth and Logic" gave supervaluationism its definitive form,
  showing how a vague language can be evaluated across all its admissible
  sharpenings while preserving the logical truths of classical logic. He has
  since moved away from that view himself.
url: https://en.wikipedia.org/wiki/Kit_Fine
