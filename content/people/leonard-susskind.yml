id: leonard-susskind
name: Leonard Susskind
born: 1940
tradition: American theoretical physics
bio: >-
  Stanford theorist, one of the originators of string theory, and Hawking's
  chief antagonist in the black hole information debate — a dispute he narrated
  in "The Black Hole War" (2008). With Gerard 't Hooft he developed the
  holographic principle, and with Larus Thorlacius and John Uglum the principle
  of black hole complementarity.
