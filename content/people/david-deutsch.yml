id: david-deutsch
name: David Deutsch
born: 1953
tradition: British theoretical physics
bio: >-
  Oxford physicist, a founder of quantum computation, and an outspoken advocate
  of the Everett interpretation. His 1985 paper defined the universal quantum
  Turing machine; his 1991 paper gave a consistency condition for quantum systems
  on closed timelike curves that removes the grandfather paradox at the cost of a
  branching, self-consistent density matrix.
