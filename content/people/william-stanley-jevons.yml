id: william-stanley-jevons
name: William Stanley Jevons
born: 1835
died: 1882
tradition: English political economy and logic
bio: >-
  English economist and logician, one of the three independent discoverers of
  marginal utility alongside Carl Menger and Léon Walras. The Coal Question
  (1865) made his reputation and contains the efficiency argument now named after
  him; The Theory of Political Economy (1871) set out the marginalist case. He
  also built one of the earliest logic machines and did pioneering work on index
  numbers. He drowned while swimming near Hastings at the age of 46.
url: https://en.wikipedia.org/wiki/William_Stanley_Jevons
