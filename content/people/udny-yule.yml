id: udny-yule
name: George Udny Yule
born: 1871
died: 1951
tradition: British statistics
bio: >-
  One of the founders of modern statistics, a student of Karl Pearson and later
  a lecturer at Cambridge. His 1903 paper on the association of attributes
  described the reversal effect now called Simpson's paradox two generations
  before Simpson, which is why some writers call it the Yule–Simpson effect.
