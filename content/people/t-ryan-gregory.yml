id: t-ryan-gregory
name: T. Ryan Gregory
born: 1976
tradition: Evolutionary biology and genome biology
bio: >-
  Canadian evolutionary biologist at the University of Guelph and curator of the
  Animal Genome Size Database. His 2001 review argued that the C-value puzzle
  should be renamed the C-value enigma, because the question is no longer why
  genome size varies at all but what causes and maintains the variation.
