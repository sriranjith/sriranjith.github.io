id: johannes-kepler
name: Johannes Kepler
born: 1571
died: 1630
tradition: German astronomy and mathematical physics
bio: >-
  Imperial mathematician at Prague and author of the three laws of planetary
  motion. In his Dissertatio cum Nuncio Sidereo of 1610 — a rapid open response
  to Galileo's telescopic discoveries — he argued that the darkness of the night
  sky is itself evidence that the realm of stars is bounded. It is the earliest
  clear statement of the problem later named after Olbers.
url: https://en.wikipedia.org/wiki/Johannes_Kepler
