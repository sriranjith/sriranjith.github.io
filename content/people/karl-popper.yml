id: karl-popper
name: Karl Popper
born: 1902
died: 1994
tradition: Austrian-British philosophy of science
bio: >-
  Philosopher of science, author of The Logic of Scientific Discovery (1934) and
  The Open Society and Its Enemies (1945), the latter written in exile in New
  Zealand during the Second World War. He is best known for falsifiability as the
  criterion of scientific status, and, in a single footnote of The Open Society,
  for the formulation now called the paradox of tolerance.
url: https://en.wikipedia.org/wiki/Karl_Popper
