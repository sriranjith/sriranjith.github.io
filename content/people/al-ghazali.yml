id: al-ghazali
name: Abū Ḥāmid al-Ghazālī
born: 1058
died: 1111
tradition: Islamic theology and philosophy, Ashʿarite kalām
bio: >-
  Persian theologian, jurist and philosopher. In The Incoherence of the
  Philosophers (c. 1095) he argued against the Avicennan claim that a will can
  never choose between indistinguishable alternatives, using the case of a man
  who must take one of two identical dates. The example predates Buridan by two
  and a half centuries and reaches the opposite conclusion.
url: https://plato.stanford.edu/entries/al-ghazali/
