id: elinor-ostrom
name: Elinor Ostrom
born: 1933
died: 2012
tradition: American political economy and institutional analysis
bio: >-
  Political economist at Indiana University and the first woman to receive the
  Nobel Memorial Prize in Economic Sciences, awarded in 2009 for her analysis of
  economic governance and especially the commons. Her fieldwork on irrigation
  systems, fisheries, forests and alpine pastures showed that communities
  routinely build durable rules for shared resources without either privatisation
  or state control, and she distilled the recurring features of the successful
  cases into eight design principles.
url: https://en.wikipedia.org/wiki/Elinor_Ostrom
