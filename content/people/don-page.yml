id: don-page
name: Don Page
born: 1948
tradition: American-Canadian theoretical physics
bio: >-
  Hawking's former graduate student, later at the University of Alberta. His
  1993 analysis of the entanglement entropy of radiation from an evaporating
  black hole produced the Page curve, the quantitative signature that unitary
  evaporation must show and semiclassical Hawking radiation does not. Reproducing
  that curve became the concrete target that the 2019 island results finally hit.
