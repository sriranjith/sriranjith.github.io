id: gabriel-cramer
name: Gabriel Cramer
born: 1704
died: 1752
tradition: Swiss mathematics
bio: >-
  Geneva mathematician remembered for Cramer's rule for solving linear systems.
  In a 1728 letter to Nicolaus Bernoulli he proposed two responses to the St
  Petersburg wager that are still the standard ones: value money by its square
  root rather than its amount, or cap value above some threshold entirely. Both
  ideas predate Daniel Bernoulli's published paper.
