id: barry-schwartz
name: Barry Schwartz
born: 1946
tradition: American psychology
bio: >-
  Psychologist, for many years at Swarthmore College. His 2004 book The Paradox
  of Choice argued that the expansion of consumer choice past a certain point
  raises regret, anticipated regret and opportunity cost, and lowers
  satisfaction. The argument reached an enormous popular audience; the
  experimental evidence for its central claim has since proved much weaker than
  the book suggested.
