id: bertrand-russell
name: Bertrand Russell
born: 1872
died: 1970
tradition: British analytic philosophy and mathematical logic
bio: >-
  British philosopher, logician and public intellectual. In 1901 he found the
  contradiction that bears his name while examining Cantor's diagonal argument,
  and in 1902 reported it to Frege in a letter that demolished the foundations of
  Frege's life's work. His theory of types (1908) and Principia Mathematica
  (1910-13, with A. N. Whitehead) were attempts to rebuild mathematics on
  paradox-free ground.
url: https://plato.stanford.edu/entries/russell/
