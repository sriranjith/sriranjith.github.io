id: aulus-gellius
name: Aulus Gellius
born: 125
tradition: Roman antiquarian scholarship
bio: >-
  Roman author of the Attic Nights, a twenty-book commonplace collection of notes
  on law, grammar, philosophy and anecdote compiled in the second century CE. His
  chapter on "convertible" arguments contains the earliest surviving telling of
  the lawsuit between Protagoras and Euathlus.
url: https://en.wikipedia.org/wiki/Aulus_Gellius
