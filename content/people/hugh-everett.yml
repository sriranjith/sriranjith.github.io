id: hugh-everett
name: Hugh Everett III
born: 1930
died: 1982
tradition: American theoretical physics
bio: >-
  Princeton graduate student whose 1957 dissertation proposed that the wave
  function never collapses and that measurement simply entangles observer with
  system — the "relative state" formulation later popularised by Bryce DeWitt as
  the many-worlds interpretation. Discouraged by the reception, including a cool
  meeting with Bohr in Copenhagen, he left academia for defence operations
  research and never returned.
url: https://en.wikipedia.org/wiki/Hugh_Everett_III
