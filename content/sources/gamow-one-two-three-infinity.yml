id: gamow-one-two-three-infinity
type: book
title: "One Two Three... Infinity: Facts and Speculations of Science"
authors:
  - George Gamow
year: 1947
publisher: Viking Press
notes: >-
  Chapter I opens with counting, cardinal arithmetic and the hotel with
  infinitely many rooms, credited by Gamow to "the unpublished, and even never
  written, but widely circulating volume: 'The Complete Collection of Hilbert
  Stories'". This is the book that made the hotel famous. Long in print as a
  Dover reprint, with the author's own illustrations.
