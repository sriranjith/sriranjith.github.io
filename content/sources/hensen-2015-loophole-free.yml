id: hensen-2015-loophole-free
type: paper
title: "Loophole-free Bell inequality violation using electron spins separated by 1.3 kilometres"
authors:
  - B. Hensen
  - et al.
year: 2015
journal: Nature
volume: "526, 682–686"
doi: 10.1038/nature15759
notes: >-
  The first experiment to close the detection and locality loopholes
  simultaneously, using entanglement swapping between nitrogen-vacancy centres
  in diamond at opposite ends of the Delft campus.
