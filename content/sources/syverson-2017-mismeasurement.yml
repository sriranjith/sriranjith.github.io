id: syverson-2017-mismeasurement
type: paper
title: Challenges to Mismeasurement Explanations for the US Productivity Slowdown
authors:
  - Chad Syverson
year: 2017
journal: Journal of Economic Perspectives
volume: "31(2), 165–186"
notes: >-
  Assembles four independent arguments against blaming the post-2004 slowdown on
  statistical mismeasurement, including the observation that the slowdown appears
  across many countries with no relation to the size of their information
  technology sectors.
