id: tipler-1980-extraterrestrial-beings
type: paper
title: "Extraterrestrial Intelligent Beings Do Not Exist"
authors:
  - Frank J. Tipler
year: 1980
journal: "Quarterly Journal of the Royal Astronomical Society"
volume: "21"
pages: "267–281"
url: https://ui.adsabs.harvard.edu/abs/1980QJRAS..21..267T/abstract
notes: >-
  Sharpens Hart's argument using von Neumann's self-reproducing automata: a
  civilisation need only launch one self-replicating probe for the Galaxy to be
  saturated on a timescale far shorter than its age. Carl Sagan and William
  Newman replied in 1983.
