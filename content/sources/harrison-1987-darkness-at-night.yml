id: harrison-1987-darkness-at-night
type: book
title: "Darkness at Night: A Riddle of the Universe"
authors:
  - Edward Harrison
year: 1987
publisher: Harvard University Press
notes: >-
  The standard history of the problem, from Kepler through Digges, Halley,
  de Chéseaux and Olbers to modern cosmology. Harrison restored Poe's priority
  on the finite-age answer and made the quantitative case that expansion is a
  secondary effect and absorption no answer at all.
