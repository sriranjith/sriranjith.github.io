id: gregory-2001-c-value-enigma
type: paper
title: "Coincidence, Coevolution, or Causation? DNA Content, Cell Size, and the C-value Enigma"
authors:
  - T. Ryan Gregory
year: 2001
journal: Biological Reviews
volume: "76(1), 65–101"
notes: >-
  Argues that calling the phenomenon a paradox is a category error now that
  non-coding DNA is understood, and proposes "C-value enigma" for the cluster of
  genuinely open questions about what generates, removes and constrains genome
  size — including the tight correlation between genome size and cell size.
