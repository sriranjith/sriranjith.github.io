title: "Shadows of the Mind: A Search for the Missing Science of Consciousness"
authors:
  - Roger Penrose
year: 1994
publisher: Oxford University Press
notes: >-
  Penrose's extended version of the Lucas argument, concluding that mathematical
  insight is non-computational. Widely criticised by logicians; see Feferman's
  1996 reply in PSYCHE and chapter 4 of Franzén (2005).
