id: dill-chan-1997-funnels
type: paper
title: From Levinthal to Pathways to Funnels
authors:
  - Ken A. Dill
  - Hue Sun Chan
year: 1997
journal: Nature Structural Biology
volume: "4(1), 10–19"
doi: 10.1038/nsb0197-10
notes: >-
  The review that made the funnel picture standard. Traces the shift from a
  single obligatory pathway to a statistical ensemble of routes down a biased
  energy landscape, and explains why that dissolves Levinthal's counting
  argument.
