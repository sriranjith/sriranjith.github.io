year: 2022
publisher: Stanford Encyclopedia of Philosophy
url: https://plato.stanford.edu/entries/luck-epistemic/
notes: >-
  Used as the closest SEP reference for the broader epistemology of charitable
  attribution that underlies Hanlon's Razor. Hanlon's Razor itself is not a
  formal philosophical doctrine but a folk epistemological heuristic.
