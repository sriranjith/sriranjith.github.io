id: sep-william-ockham
type: encyclopedia
title: "William of Ockham"
authors:
  - Paul Vincent Spade
  - Claude Panaccio
year: 2019
publisher: Stanford Encyclopedia of Philosophy
url: https://plato.stanford.edu/entries/ockham/
notes: >-
  Comprehensive overview of Ockham's logic and metaphysics, including his
  formulation of parsimony and the contexts in which he applied it. Clarifies
  that the famous phrasing "entities are not to be multiplied beyond necessity"
  was a later summarisation, not Ockham's own words.
