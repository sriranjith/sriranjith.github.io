id: kolata-1990-42nd-street
type: further-reading
title: What if They Closed 42d Street and Nobody Noticed?
authors:
  - Gina Kolata
year: 1990
publisher: The New York Times
notes: >-
  Contemporary report on Earth Day 1990, when New York City closed 42nd Street -
  expected to be a traffic disaster - and traffic flow improved. The article
  quotes the mathematicians who connected the outcome to Braess's paradox.
