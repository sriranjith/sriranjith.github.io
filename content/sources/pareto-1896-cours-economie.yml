id: pareto-1896-cours-economie
type: book
title: "Cours d'économie politique"
authors:
  - Vilfredo Pareto
year: 1896
publisher: Rouge
notes: >-
  The two-volume work in which Italian economist Vilfredo Pareto first
  documented the income distribution observation that became the Pareto
  Principle: in 1896 Italy, approximately 80% of the land was owned by 20%
  of the population. Pareto found the same distribution in other countries.
  The principle was later popularised as a general rule by Joseph Juran in
  quality management in the 1940s, who named it after Pareto and generalised
  it to quality defects (80% of problems caused by 20% of causes). The 80/20
  phrasing is Juran's, not Pareto's — Pareto described a power law, not a
  specific ratio.
