id: levinthal-1968-pathways
type: primary-source
title: Are There Pathways for Protein Folding?
authors:
  - Cyrus Levinthal
year: 1968
journal: Journal de Chimie Physique
volume: "65, 44–45"
notes: >-
  Two pages. Levinthal argues that the number of accessible conformations is
  astronomically large, that folding must therefore follow pathways rather than
  search, and — importantly — that the native state need not be the global
  energy minimum. He posed this as an argument, not as a paradox; the name came
  later.
