id: kneale-development-of-logic
type: academic-reference
title: The Development of Logic
authors:
  - William Kneale
  - Martha Kneale
year: 1962
publisher: "Clarendon Press, Oxford"
notes: >-
  The standard history of logic from Aristotle to the twentieth century. Its
  account of the Megarian and Stoic logicians is the usual scholarly reference for
  the ancient career of the Liar and for the attribution of the puzzle to
  Eubulides rather than Epimenides.
