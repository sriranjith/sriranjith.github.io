id: dunbar-1992-neocortex-size
type: paper
title: "Neocortex size as a constraint on group size in primates"
authors:
  - Robin I. M. Dunbar
year: 1992
journal: Journal of Human Evolution
volume: "22(6)"
pages: "469–493"
doi: 10.1016/0047-2484(92)90081-J
notes: >-
  The paper in which British anthropologist Robin Dunbar established the
  correlation between neocortex size and social group size across 38 primate
  species, and extrapolated the predicted group size for humans from their
  neocortical ratio to approximately 148 (conventionally rounded to 150).
  Dunbar subsequently validated the 150 figure against ethnographic data on
  hunter-gatherer band sizes, village sizes in pre-industrial societies, and
  military unit organisation. The claim is that 150 is the maximum number of
  individuals with whom a person can maintain stable social relationships
  without formal hierarchical structures.
