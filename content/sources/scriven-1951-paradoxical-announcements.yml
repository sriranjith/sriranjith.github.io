title: Paradoxical Announcements
authors:
  - Michael Scriven
year: 1951
journal: Mind
volume: "60(239)"
pages: "403–407"
notes: >-
  An early contribution to the Mind exchange, insisting that the puzzle is a
  genuine one about the logical relation between an event and its predictability
  rather than a simple mistake by the prisoner.
