id: easterlin-1974-human-lot
type: primary-source
title: "Does Economic Growth Improve the Human Lot? Some Empirical Evidence"
authors:
  - Richard A. Easterlin
year: 1974
publisher: "Academic Press, in Nations and Households in Economic Growth: Essays in Honor of Moses Abramovitz, ed. Paul A. David and Melvin W. Reder, 89–125"
notes: >-
  The founding paper of the economics of happiness. Sets out the three stylised
  facts — a positive within-country cross-sectional gradient, a weak
  cross-national one, and no long-run time-series relationship — and proposes
  relative income and adaptation as the explanation. Easterlin was explicit about
  the limitations of the data he had.
