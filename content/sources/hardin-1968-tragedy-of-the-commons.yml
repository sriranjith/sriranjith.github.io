id: hardin-1968-tragedy-of-the-commons
type: primary-source
title: The Tragedy of the Commons
authors:
  - Garrett Hardin
year: 1968
journal: Science
volume: "162(3859), 1243-1248"
doi: 10.1126/science.162.3859.1243
notes: >-
  The essay that named the idea. Its actual subject is population growth: Hardin
  argues that the population problem has "no technical solution" and closes by
  advocating "mutual coercion, mutually agreed upon" and the abandonment of the
  freedom to breed. The herdsmen-on-a-pasture illustration occupies about a page
  of the paper and is the part that survived.
