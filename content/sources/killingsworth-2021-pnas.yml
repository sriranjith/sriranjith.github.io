id: killingsworth-2021-pnas
type: paper
title: "Experienced well-being rises with income, even above $75,000 per year"
authors:
  - Matthew A. Killingsworth
year: 2021
journal: "Proceedings of the National Academy of Sciences"
volume: "118(4), e2016976118"
doi: 10.1073/pnas.2016976118
notes: >-
  1,725,994 real-time experience-sampling reports from 33,391 employed US adults.
  Finds experienced wellbeing rising log-linearly with income across the whole
  range, with no plateau, contradicting the earlier $75,000 finding.
