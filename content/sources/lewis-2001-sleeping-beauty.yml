id: lewis-2001-sleeping-beauty
type: primary-source
title: "Sleeping Beauty: reply to Elga"
authors:
  - David Lewis
year: 2001
journal: Analysis
volume: "61(3), 171–176"
doi: 10.1093/analys/61.3.171
notes: >-
  The canonical halfer reply, and one of the last pieces Lewis published. He
  accepts the cost that most readers find hardest: on his view, learning that it
  is Monday should raise Beauty's credence in heads to 2/3, even though the coin
  has not yet been tossed.
