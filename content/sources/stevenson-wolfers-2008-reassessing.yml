id: stevenson-wolfers-2008-reassessing
type: paper
title: "Economic Growth and Subjective Well-Being: Reassessing the Easterlin Paradox"
authors:
  - Betsey Stevenson
  - Justin Wolfers
year: 2008
journal: "Brookings Papers on Economic Activity"
volume: "Spring 2008, 1–87"
notes: >-
  Using the Gallup World Poll and reconstructed national series, finds a robust
  relationship between subjective wellbeing and log income of similar magnitude
  within countries, across countries and over time, with no visible satiation
  point. Argues the paradox was an artefact of thin data, and criticises the
  Japanese series on which much of the original case rested.
