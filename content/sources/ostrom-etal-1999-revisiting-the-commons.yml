id: ostrom-etal-1999-revisiting-the-commons
type: paper
title: "Revisiting the Commons: Local Lessons, Global Challenges"
authors:
  - Elinor Ostrom
  - Joanna Burger
  - Christopher B. Field
  - Richard B. Norgaard
  - David Policansky
year: 1999
journal: Science
volume: "284(5412), 278-282"
doi: 10.1126/science.284.5412.278
notes: >-
  Published in the same journal as Hardin's essay thirty-one years later. States
  plainly that Hardin's analysis applies to open-access resources rather than to
  commons with defined users and rules, and asks what happens when the commons
  is global and no community boundary exists.
