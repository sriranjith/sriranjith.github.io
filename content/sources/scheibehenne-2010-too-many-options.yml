id: scheibehenne-2010-too-many-options
type: paper
title: "Can There Ever Be Too Many Options? A Meta-Analytic Review of Choice Overload"
authors:
  - Benjamin Scheibehenne
  - Rainer Greifeneder
  - Peter M. Todd
year: 2010
journal: Journal of Consumer Research
volume: "37(3), 409-425"
doi: 10.1086/651235
notes: >-
  Meta-analysis of 50 experimental comparisons. Finds a mean effect size close
  to zero with substantial variance across studies, and concludes that the
  conditions under which choice overload occurs are not yet identified. The
  single most important corrective to the popular version of the paradox of
  choice.
