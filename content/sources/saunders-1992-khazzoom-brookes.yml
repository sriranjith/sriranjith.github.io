id: saunders-1992-khazzoom-brookes
type: paper
title: "The Khazzoom-Brookes Postulate and Neoclassical Growth"
authors:
  - Harry D. Saunders
year: 1992
journal: The Energy Journal
volume: "13(4), 131–148"
notes: >-
  Names the postulate after Daniel Khazzoom and Leonard Brookes and derives it
  inside a neoclassical growth model, showing that energy efficiency gains raise
  long-run energy consumption for a range of plausible substitution elasticities.
  The result is real but conditional on parameters that are assumed rather than
  estimated, which is the technical core of the modern dispute.
