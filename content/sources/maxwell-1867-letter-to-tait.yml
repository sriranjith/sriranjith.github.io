id: maxwell-1867-letter-to-tait
type: primary-source
title: "Letter to Peter Guthrie Tait, 11 December 1867"
authors:
  - James Clerk Maxwell
year: 1867
notes: >-
  Where the demon first appears, as "a very observant and neat-fingered being"
  who opens and closes a hole in a partition to sort fast molecules from slow.
  Maxwell's stated purpose was to "pick a hole" in the second law and show that
  it is statistical rather than absolute. Printed in C. G. Knott, Life and
  Scientific Work of Peter Guthrie Tait (Cambridge, 1911).
