id: aulus-gellius-attic-nights
type: primary-source
title: "Attic Nights (Noctes Atticae)"
authors:
  - Aulus Gellius
year: "c. 180"
publisher: "Standard English text: J. C. Rolfe, Loeb Classical Library, 1927"
notes: >-
  Book V chapter 10 is the earliest surviving account of the lawsuit between
  Protagoras and Euathlus. Gellius presents it as an example of what the Greeks
  called an antistrephon - a reversible or convertible argument, one that can be
  turned back with equal force on the person who made it - and ends with the
  judges refusing to rule and adjourning the case to a distant date.
