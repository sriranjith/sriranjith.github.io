id: sider-2001-four-dimensionalism
type: book
title: "Four-Dimensionalism: An Ontology of Persistence and Time"
authors:
  - Theodore Sider
year: 2001
publisher: "Clarendon Press / Oxford University Press"
notes: >-
  The standard defence of perdurantism: objects persist by having temporal
  parts, as they extend through space by having spatial parts. Chapter 5 uses
  the argument from vagueness to press unrestricted composition, and the
  framework dissolves puzzle cases like the Ship of Theseus and fission by
  allowing two four-dimensional objects to share their earlier temporal parts
  and diverge later.
