id: nagy-2007-hypertumours
type: paper
title: "Why Don't All Whales Have Cancer? A Novel Hypothesis Resolving Peto's Paradox"
authors:
  - John D. Nagy
  - Erin M. Victor
  - Jenese H. Cropper
year: 2007
journal: Integrative and Comparative Biology
volume: "47(2), 317–328"
notes: >-
  Proposes hypertumours: in a very large animal a tumour lives long enough for
  parasitic sub-clones to evolve inside it, cheat on the blood supply the parent
  tumour built, and destroy it before it kills the host.
