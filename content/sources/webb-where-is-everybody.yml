id: webb-where-is-everybody
type: book
title: "If the Universe Is Teeming with Aliens ... WHERE IS EVERYBODY? Seventy-Five Solutions to the Fermi Paradox and the Problem of Extraterrestrial Life"
authors:
  - Stephen Webb
year: 2015
publisher: "Springer, Cham"
notes: >-
  Second edition, expanded from fifty solutions to seventy-five. The most
  complete catalogue of proposed answers, each stated fairly and then assessed.
  Webb's own conclusion favours a rare-Earth-style answer, but he is explicit
  that it is a preference rather than a result.
