id: priest-in-contradiction
type: book
title: "In Contradiction: A Study of the Transconsistent"
authors:
  - Graham Priest
year: 2006
publisher: "Oxford University Press (second, expanded edition; first published 1987)"
notes: >-
  The book-length case for dialetheism. Priest accepts that the Liar is both true
  and false and blocks the resulting catastrophe by adopting a paraconsistent
  logic in which a contradiction does not entail every sentence.
