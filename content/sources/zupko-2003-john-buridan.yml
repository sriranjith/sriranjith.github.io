id: zupko-2003-john-buridan
type: book
title: "John Buridan: Portrait of a Fourteenth-Century Arts Master"
authors:
  - Jack Zupko
year: 2003
publisher: University of Notre Dame Press
notes: >-
  The standard intellectual biography. Zupko reconstructs Buridan's actual
  account of freedom - the will's capacity to defer, to suspend judgement and
  to send the intellect back for further deliberation - and explains why the
  starving-donkey caricature misrepresents it.
