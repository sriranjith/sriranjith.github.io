id: kepler-1610-dissertatio
type: primary-source
title: "Dissertatio cum Nuncio Sidereo"
authors:
  - Johannes Kepler
year: 1610
publisher: Prague
notes: >-
  Kepler's open letter responding to Galileo's Sidereus Nuncius. It contains the
  earliest clear statement of the dark-sky argument: if stars filled an
  unbounded space, the whole sky would shine, so the stellar realm must be
  finite and enclosed.
