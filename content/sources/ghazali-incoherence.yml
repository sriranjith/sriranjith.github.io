id: ghazali-incoherence
type: primary-source
title: "The Incoherence of the Philosophers (Tahāfut al-Falāsifa)"
authors:
  - Abu Hamid al-Ghazali
year: "1095"
publisher: "Standard English text: Michael E. Marmura, Brigham Young University Press, 1997"
notes: >-
  In the first discussion, on the eternity of the world, al-Ghazali uses the
  example of a man facing two identical dates who may take either. His point is
  that the will has a genuine power to select between indistinguishable options
  without a differentiating reason - a doctrine directly opposed to the
  intellectualist position later caricatured by the starving donkey.
