id: hardin-1974-lifeboat-ethics
type: primary-source
title: "Lifeboat Ethics: The Case Against Helping the Poor"
authors:
  - Garrett Hardin
year: 1974
journal: Psychology Today
volume: "8, 38-43"
notes: >-
  Hardin's own extension of the commons argument to immigration and food aid,
  arguing that rich nations are lifeboats that must refuse the people in the
  water. Cited here as primary evidence of the political programme the commons
  essay was written to serve.
