id: nalebuff-1989-envelope
type: paper
title: "Puzzles: The Other Person's Envelope Is Always Greener"
authors:
  - Barry Nalebuff
year: 1989
journal: Journal of Economic Perspectives
volume: "3(1), 171–181"
doi: 10.1257/jep.3.1.171
notes: >-
  Written in response to the flood of mail provoked by the puzzle Nalebuff had
  posed a year earlier in the same column. Sorts the proposed solutions,
  separates the closed-envelope from the open-envelope versions, and is the
  reason the problem is now told with envelopes.
