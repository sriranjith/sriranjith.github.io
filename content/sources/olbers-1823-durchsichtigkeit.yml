id: olbers-1823-durchsichtigkeit
type: primary-source
title: "Ueber die Durchsichtigkeit des Weltraums"
authors:
  - Heinrich Wilhelm Olbers
year: 1823
journal: "Astronomisches Jahrbuch für das Jahr 1826 (ed. J. E. Bode)"
publisher: Berlin
notes: >-
  "On the transparency of space." The almanac carries 1826 on its title page but
  was printed in 1823, which is the date conventionally cited. Olbers restates
  the dark-sky problem and proposes that absorbing interstellar matter removes
  the missing starlight. An English translation is printed as an appendix to
  Harrison's Darkness at Night.
