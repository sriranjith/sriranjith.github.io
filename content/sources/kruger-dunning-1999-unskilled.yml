id: kruger-dunning-1999-unskilled
type: primary-source
title: "Unskilled and Unaware of It: How Difficulties in Recognizing One's Own Incompetence Lead to Inflated Self-Assessments"
authors:
  - Justin Kruger
  - David Dunning
year: 1999
journal: Journal of Personality and Social Psychology
volume: "77(6)"
pages: "1121–1134"
doi: 10.1037/0022-3514.77.6.1121
notes: >-
  The original paper documenting the effect in four studies: logical reasoning,
  grammar, and humour. Concludes that incompetence prevents its own recognition
  and that high performers underestimate their relative standing. Won the Ig Nobel
  Prize for Psychology in 2000.
