id: simplicius-in-physica
type: primary-source
title: "Commentary on Aristotle's Physics (In Aristotelis Physicorum Libros Commentaria)"
authors:
  - Simplicius of Cilicia
year: "c. 540"
publisher: "Greek text ed. Hermann Diels, Commentaria in Aristotelem Graeca vols 9-10, Berlin 1882-1895"
notes: >-
  The single most important witness to Zeno. Simplicius quotes Zeno's arguments
  against plurality verbatim - these are the only continuous words of Zeno that
  survive - and reports and discusses the motion paradoxes while commenting on
  Physics VI. English translations of the relevant books appear in the Ancient
  Commentators on Aristotle series.
