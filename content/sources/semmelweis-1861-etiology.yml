id: semmelweis-1861-etiology
type: book
title: "Die Ätiologie, der Begriff und die Prophylaxe des Kindbettfiebers"
authors:
  - Ignaz Philipp Semmelweis
year: 1861
publisher: C.A. Hartleben
notes: >-
  Semmelweis's major work presenting his data on puerperal (childbed) fever
  and the evidence that handwashing by physicians dramatically reduced
  mortality. At the Vienna Maternity Hospital, wards attended by medical
  students who came directly from autopsies had mortality rates of 10–35%;
  wards attended by midwives had rates below 4%. When Semmelweis instituted
  mandatory chlorinated lime handwashing in May 1847, mortality in the
  doctors' ward dropped to below 2%. Despite this data, the medical
  establishment largely rejected his conclusions. He was dismissed from his
  position, ridiculed by colleagues, and died in a psychiatric institution
  in 1865, fourteen years before Pasteur's germ theory vindicated him.
