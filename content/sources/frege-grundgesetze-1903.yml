id: frege-grundgesetze-1903
type: primary-source
title: "Grundgesetze der Arithmetik, Band II"
authors:
  - Gottlob Frege
year: 1903
publisher: "Jena: Hermann Pohle"
notes: >-
  The appendix (Nachwort), written after the volume was already at the printer,
  opens by admitting that nothing worse can befall a writer than having a
  foundation shaken once the work is done. It states Russell's contradiction and
  offers Frege's attempted repair to Basic Law V, later shown by Leśniewski to be
  itself inconsistent.
