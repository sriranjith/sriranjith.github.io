id: ringelmann-1913-recherches
type: paper
title: "Recherches sur les moteurs animés: Travail de l'homme"
authors:
  - Max Ringelmann
year: 1913
journal: Annales de l'Institut National Agronomique
volume: "12(2)"
pages: "1–40"
notes: >-
  The paper in which French agricultural engineer Max Ringelmann reported
  his rope-pulling experiments, originally conducted in the 1880s. Ringelmann
  found that as group size increased, individual average force exerted
  decreased: two people pulling a rope exerted less than twice the force of
  one person, eight people less than eight times as much. He attributed this
  to coordination losses and motivational decline. The effect was rediscovered
  and named by Ingham et al. in 1974, who separated coordination losses from
  motivational losses and coined the term "social loafing" for the
  motivational component.
