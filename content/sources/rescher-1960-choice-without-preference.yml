id: rescher-1960-choice-without-preference
type: paper
title: "Choice Without Preference: A Study of the History and of the Logic of the Problem of 'Buridan's Ass'"
authors:
  - Nicholas Rescher
year: "1959/60"
journal: Kant-Studien
volume: "51"
pages: "142–175"
notes: >-
  The standard historical study. Rescher traces the problem from Aristotle's De
  Caelo through Arabic discussions of the will to the fourteenth-century Latin
  debates, and documents that the donkey does not appear in Buridan's own
  writings. Reprinted in Rescher's Essays in Philosophical Analysis (1969).
