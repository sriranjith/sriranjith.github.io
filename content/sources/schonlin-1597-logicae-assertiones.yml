id: schonlin-1597-logicae-assertiones
type: primary-source
title: Logicae Assertiones
authors:
  - Schönlin
year: 1597
notes: >-
  The earliest recorded attachment of Buridan's name to the starving-donkey
  example. The story had circulated for two centuries before this, and Buridan
  himself had been dead for more than two hundred years, so the phrase "Buridan's
  ass" is a late label applied to a much older puzzle rather than a record of
  anything Buridan wrote.
