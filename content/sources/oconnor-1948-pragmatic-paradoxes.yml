id: oconnor-1948-pragmatic-paradoxes
type: primary-source
title: Pragmatic Paradoxes
authors:
  - D. J. O'Connor
year: 1948
journal: Mind
volume: "57(227)"
pages: "358–359"
notes: >-
  The first appearance of the paradox in print, in the form of a military
  commander announcing a class A blackout that would take place in the coming
  week but whose date the men could not deduce in advance. O'Connor concluded
  that the announcement was self-refuting - a statement that cannot be both true
  and known.
