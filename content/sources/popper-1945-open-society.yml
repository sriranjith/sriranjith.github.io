id: popper-1945-open-society
type: primary-source
title: "The Open Society and Its Enemies, Volume 1: The Spell of Plato"
authors:
  - Karl Popper
year: 1945
publisher: Routledge
notes: >-
  The paradox of tolerance appears in note 4 to chapter 7, not in the main text.
  Popper states that unlimited tolerance leads to the disappearance of
  tolerance, but immediately adds that he does not imply we should always
  suppress intolerant philosophies, that suppression would be unwise as long as
  they can be countered by rational argument and kept in check by public
  opinion, and that the right to suppress should be claimed only if the
  intolerant answer argument with fists.
