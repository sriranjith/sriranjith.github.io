id: harvey-1974-abilene-paradox
type: primary-source
title: "The Abilene Paradox: The Management of Agreement"
authors:
  - Jerry B. Harvey
year: 1974
journal: Organizational Dynamics
volume: "3(1), 63-80"
doi: 10.1016/0090-2616(74)90005-9
notes: >-
  The original article. Opens with the drive to Abilene, adds two organisational
  cases, and sets out the six symptoms of the paradox together with Harvey's
  diagnosis: action anxiety, negative fantasies about the consequences of
  speaking, and a real fear of separation from the group.
