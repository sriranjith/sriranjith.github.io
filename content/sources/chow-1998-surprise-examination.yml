id: chow-1998-surprise-examination
type: paper
title: The Surprise Examination or Unexpected Hanging Paradox
authors:
  - Timothy Y. Chow
year: 1998
journal: The American Mathematical Monthly
volume: "105(1)"
pages: "41–51"
notes: >-
  The standard survey. Chow sorts five decades of proposed solutions, argues
  that the logical-self-reference and the epistemological readings are genuinely
  different paradoxes rather than rival treatments of one, and gives a clean
  account of the Kaplan-Montague and Fitch formalisations. Includes the report
  that the paradox entered circulation through a 1943 or 1944 Swedish civil
  defence broadcast, noticed by the mathematician Lennart Ekbom.
