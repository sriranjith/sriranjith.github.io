id: rice-1953-classes
type: paper
title: "Classes of Recursively Enumerable Sets and Their Decision Problems"
authors:
  - Henry Gordon Rice
year: 1953
journal: Transactions of the American Mathematical Society
volume: "74(2)"
pages: "358–366"
notes: >-
  Proves that every non-trivial semantic property of a program — any property of
  the function it computes that some programs have and others lack — is
  undecidable. The sweeping generalisation of the halting problem.
