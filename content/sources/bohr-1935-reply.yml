id: bohr-1935-reply
type: primary-source
title: "Can Quantum-Mechanical Description of Physical Reality Be Considered Complete?"
authors:
  - Niels Bohr
year: 1935
journal: Physical Review
volume: "48, 696–702"
doi: 10.1103/PhysRev.48.696
notes: >-
  Bohr's reply, published under the identical title four months after EPR. He
  denies that the reality criterion applies, on the grounds that the choice of
  measurement on one wing fixes what "the conditions which define the possible
  types of predictions" are for the whole arrangement.
