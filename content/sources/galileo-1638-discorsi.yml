id: galileo-1638-discorsi
type: primary-source
title: "Discorsi e dimostrazioni matematiche, intorno à due nuove scienze"
authors:
  - Galileo Galilei
year: 1638
publisher: Lodewijk Elzevir, Leiden
notes: >-
  Galileo's last book, smuggled out of Italy and printed in Leiden while he was
  under house arrest. The argument about squares and whole numbers is in the
  First Day, in the exchange between Salviati and Simplicio. Standard English
  translation: Crew and de Salvio, Dialogues Concerning Two New Sciences (1914);
  a later translation by Stillman Drake appeared as Two New Sciences (1974).
