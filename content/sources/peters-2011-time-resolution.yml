id: peters-2011-time-resolution
type: paper
title: The time resolution of the St Petersburg paradox
authors:
  - Ole Peters
year: 2011
journal: Philosophical Transactions of the Royal Society A
volume: "369(1956), 4913–4931"
doi: 10.1098/rsta.2011.0065
notes: >-
  Argues that the expectation over parallel possible outcomes is the wrong
  average for a gambler who lives through time, and computes the time-average
  growth rate instead. The resulting fair price is finite and wealth-dependent.
  Critics — notably a 2013 rebuttal by Jayanth Varma — reply that the decision
  rule is the Kelly criterion and reproduces Bernoulli's logarithmic answer by
  another route.
