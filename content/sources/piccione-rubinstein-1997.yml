id: piccione-rubinstein-1997
type: paper
title: "On the Interpretation of Decision Problems with Imperfect Recall"
authors:
  - Michele Piccione
  - Ariel Rubinstein
year: 1997
journal: Games and Economic Behavior
volume: "20(1), 3–24"
notes: >-
  Poses the absent-minded driver problem and, in the same framework, a decision
  problem with the structure of Sleeping Beauty — three years before Elga's paper
  and from the direction of game theory rather than epistemology.
