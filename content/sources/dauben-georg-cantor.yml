id: dauben-georg-cantor
type: book
title: "Georg Cantor: His Mathematics and Philosophy of the Infinite"
authors:
  - Joseph W. Dauben
year: 1990
publisher: Princeton University Press
notes: >-
  The standard scholarly biography. First published by Harvard University Press
  in 1979. Definitive on the difference between the 1874 and 1891 proofs, on the
  Kronecker dispute, and on Cantor's theological reading of the transfinite.
