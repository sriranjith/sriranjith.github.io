id: parkinson-1955-law
type: primary-source
title: "Parkinson's Law"
authors:
  - C. Northcote Parkinson
year: 1955
journal: The Economist
url: https://www.economist.com/news/1955/11/19/parkinsons-law
notes: >-
  The original essay, published 19 November 1955. Uses satirical statistics about
  the British Colonial Office and Admiralty to argue that bureaucratic staffing
  is independent of workload. The opening sentence became one of the most quoted
  lines in management literature.
