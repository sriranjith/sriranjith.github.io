id: gordon-2016-rise-and-fall
type: book
title: "The Rise and Fall of American Growth: The U.S. Standard of Living Since the Civil War"
authors:
  - Robert J. Gordon
year: 2016
publisher: Princeton University Press
notes: >-
  The pessimistic case. Argues that the inventions of 1870–1970 — electricity,
  the internal combustion engine, indoor plumbing, chemicals, communications —
  transformed daily life in ways digital technology has not matched, and that the
  slow growth since 1970 is the normal condition rather than an anomaly.
