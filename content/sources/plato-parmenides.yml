id: plato-parmenides
type: primary-source
title: Parmenides
authors:
  - Plato
year: "c. 370 BCE"
notes: >-
  At 127a-128e Plato stages a meeting between the young Socrates, Parmenides and
  Zeno, and has Zeno describe his own book: it was written in his youth to defend
  Parmenides by showing that the hypothesis of plurality leads to consequences
  more ridiculous than monism. This is the closest thing to contemporary evidence
  about what Zeno was trying to do, and it is a philosophical dialogue, not a
  historical record.
