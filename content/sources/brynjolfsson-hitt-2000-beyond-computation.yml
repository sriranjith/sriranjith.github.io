id: brynjolfsson-hitt-2000-beyond-computation
type: paper
title: "Beyond Computation: Information Technology, Organizational Transformation and Business Performance"
authors:
  - Erik Brynjolfsson
  - Lorin M. Hitt
year: 2000
journal: Journal of Economic Perspectives
volume: "14(4), 23–48"
doi: 10.1257/jep.14.4.23
notes: >-
  Firm-level evidence that computing did raise productivity, but only in
  combination with complementary organisational change, and that the measured
  returns grow the longer the horizon over which they are estimated.
