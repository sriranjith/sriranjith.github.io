id: penington-2019-islands
type: primary-source
title: "Entanglement Wedge Reconstruction and the Information Paradox"
authors:
  - Geoff Penington
year: 2019
journal: "arXiv preprint (published JHEP 2020(9), 002)"
volume: "arXiv:1905.08255"
url: https://arxiv.org/abs/1905.08255
notes: >-
  With the companion paper of Almheiri, Engelhardt, Marolf and Maxfield, showed
  that the quantum extremal surface prescription reproduces the Page curve, by
  making the entanglement wedge of the radiation include an "island" inside the
  black hole after the Page time.
