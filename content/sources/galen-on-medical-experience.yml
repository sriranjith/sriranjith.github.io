id: galen-on-medical-experience
type: primary-source
title: On Medical Experience
authors:
  - Galen
year: "c. 165"
publisher: "Surviving in Arabic; standard English text: R. Walzer, Oxford University Press, 1944"
notes: >-
  Chapters 16-17 contain the fullest ancient discussion of the sorites. Galen
  complains that the argument would, if accepted, destroy the possibility of
  medical knowledge built from accumulated cases, and describes the exasperating
  experience of being asked grain by grain where the heap begins. The Greek
  original is lost.
