id: rosenthal-jacobson-1968-pygmalion
type: book
title: "Pygmalion in the Classroom: Teacher Expectation and Pupils' Intellectual Development"
authors:
  - Robert Rosenthal
  - Lenore Jacobson
year: 1968
publisher: Holt, Rinehart and Winston
isbn: "9780839104582"
notes: >-
  The foundational study and book reporting on the Oak School experiment at a
  California elementary school. Rosenthal and Jacobson told teachers at random
  that certain students were "intellectual bloomers" expected to show unusual
  gains. Those students — selected at random — subsequently showed significantly
  greater IQ gains. The book remains the entry point for the Pygmalion Effect
  literature, though its methodology has been debated extensively since
  publication.
