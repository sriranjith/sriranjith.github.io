id: jones-1985-where-is-everybody
type: primary-source
title: "\"Where Is Everybody?\" An Account of Fermi's Question"
authors:
  - Eric M. Jones
year: 1985
publisher: "Los Alamos National Laboratory, LA-10311-MS"
notes: >-
  Jones wrote to the surviving lunch companions — Emil Konopinski, Edward Teller
  and Herbert York — and printed their recollections. It is the only documentary
  basis for the 1950 remark, and it establishes that Fermi's question was about
  the feasibility of interstellar travel, not about the absence of radio
  signals.
