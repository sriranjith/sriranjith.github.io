id: mcgeady-2010-cunninghams-law
type: encyclopedia
title: "Cunningham's Law"
authors:
  - Steven McGeady
year: 2010
url: https://meta.wikimedia.org/wiki/Cunningham%27s_Law
notes: >-
  The original articulation of Cunningham's Law by Steven McGeady, who
  attributed the principle to Ward Cunningham (inventor of the wiki). McGeady
  stated that Cunningham had told him: "The best way to get the right answer
  on the Internet is not to ask a question; it's to post the wrong answer."
  The principle was popularised by a 2010 reference in a New York Times
  technology column. It captures the observation that people are more motivated
  to correct errors than to answer questions, so posting an incorrect claim
  reliably elicits correct information faster than asking politely.
