id: campbell-1979-planned-social-change
type: paper
title: Assessing the Impact of Planned Social Change
authors:
  - Donald T. Campbell
year: 1979
journal: Evaluation and Program Planning
volume: "2(1), 67–90"
notes: >-
  Circulated as an occasional paper from 1976 and published in this form in 1979.
  Contains Campbell's Law: the more a quantitative social indicator is used for
  social decision-making, the more it will distort and corrupt the processes it
  was meant to monitor. Campbell's examples are drawn from policing statistics
  and standardised testing.
