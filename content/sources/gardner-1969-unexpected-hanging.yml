id: gardner-1969-unexpected-hanging
type: book
title: The Unexpected Hanging and Other Mathematical Diversions
authors:
  - Martin Gardner
year: 1969
publisher: Simon & Schuster
notes: >-
  The title chapter is the essay that carried the paradox to a general audience
  and fixed the hanging version as the standard telling. Gardner surveys the
  Mind literature to that date, reports the Swedish broadcast origin, and calls
  it a paradox that has resisted every attempt at a clean solution.
