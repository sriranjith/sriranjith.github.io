id: hobbes-1655-de-corpore
type: primary-source
title: "De Corpore (Elements of Philosophy, The First Section: Concerning Body)"
authors:
  - Thomas Hobbes
year: 1655
publisher: "Latin 1655; author-supervised English translation 1656"
notes: >-
  Part II, chapter 11, "Of Identity and Difference", contains the decisive
  sharpening of the Ship of Theseus. Hobbes imagines the discarded planks
  collected and reassembled into a second ship, and observes that if identity
  followed matter the reassembled ship would be the original, while if it
  followed continuous form the repaired ship would be - so that on the two
  criteria together there would be two bodies numerically the same, which he
  calls absurd.
