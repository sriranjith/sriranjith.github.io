id: hafele-keating-1972
type: paper
title: "Around-the-World Atomic Clocks: Predicted and Observed Relativistic Time Gains"
authors:
  - J. C. Hafele
  - Richard E. Keating
year: 1972
journal: Science
volume: "177(4044)"
pages: "166–170"
doi: 10.1126/science.177.4044.166
notes: >-
  Two companion papers. Four caesium clocks were flown on scheduled commercial
  flights, eastward and westward, in October 1971. Predicted: −40 ± 23 ns
  eastward, +275 ± 21 ns westward. Observed: −59 ± 10 ns and +273 ± 7 ns. The
  observed paper is at pages 168–170, doi 10.1126/science.177.4044.168.
