id: brandolini-2013-bullshit
type: encyclopedia
title: "Bullshit Asymmetry Principle"
authors:
  - Alberto Brandolini
year: 2013
url: https://twitter.com/ziobrando/status/289635060758507521
notes: >-
  The original formulation by Italian programmer Alberto Brandolini, posted
  on Twitter on January 11, 2013: "The amount of energy needed to refute
  bullshit is an order of magnitude bigger than to produce it." Brandolini
  has since refined the statement and noted he was inspired by a passage in
  Nassim Taleb's The Black Swan (2007) about asymmetric costs of refutation.
  The principle spread virally in media and academic circles and is now
  commonly called Brandolini's Law, Brandolini's Principle, or the Bullshit
  Asymmetry Principle.
