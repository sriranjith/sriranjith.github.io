id: charig-1986-kidney-stones
type: paper
title: "Comparison of treatment of renal calculi by open surgery, percutaneous nephrolithotomy, and extracorporeal shockwave lithotripsy"
authors:
  - C. R. Charig
  - D. R. Webb
  - S. R. Payne
  - J. E. Wickham
year: 1986
journal: "British Medical Journal (Clinical Research Edition)"
volume: "292(6524), 879–882"
notes: >-
  A clinical comparison of kidney-stone treatments at St Bartholomew's and the
  Institute of Urology in London. The open-surgery versus percutaneous
  nephrolithotomy figures from this study became the standard medical example of
  Simpson's paradox after Julious and Mullee reanalysed them in 1994.
