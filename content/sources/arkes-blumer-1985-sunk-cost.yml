id: arkes-blumer-1985-sunk-cost
type: paper
title: "The Psychology of Sunk Cost"
authors:
  - Hal R. Arkes
  - Catherine Blumer
year: 1985
journal: Organizational Behavior and Human Decision Processes
volume: "35(1)"
pages: "124–140"
doi: 10.1016/0749-5978(85)90049-4
notes: >-
  The foundational paper that established the sunk cost fallacy as a
  systematic psychological bias with controlled experimental evidence. Arkes
  and Blumer used a series of scenarios — a pre-paid ski trip to a less
  attractive resort, continued investment in a failing project — to show
  that people consistently violated the normative economic principle that
  sunk costs should be irrelevant to future decisions. The paper identified
  waste aversion (not wanting to "waste" past investment) as the primary
  psychological mechanism. It remains the standard reference for the
  empirical foundation of the sunk cost fallacy.
