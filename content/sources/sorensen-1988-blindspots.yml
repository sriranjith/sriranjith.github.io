id: sorensen-1988-blindspots
type: book
title: Blindspots
authors:
  - Roy Sorensen
year: 1988
publisher: "Clarendon Press / Oxford University Press"
notes: >-
  Develops the idea of a blindspot: a proposition that is consistent but that a
  particular person cannot consistently believe. The judge's sentence is a
  blindspot for the prisoner, which explains how the decree can be both true and
  unknowable by the one person it concerns without any contradiction in the
  world.
