id: jensen-miller-2008-giffen
type: paper
title: "Giffen Behavior and Subsistence Consumption"
authors:
  - Robert T. Jensen
  - Nolan H. Miller
year: 2008
journal: American Economic Review
volume: "98(4), 1553–1577"
doi: 10.1257/aer.98.4.1553
notes: >-
  Randomised price subsidies for the household staple — rice in Hunan, wheat in
  Gansu — provide the first credible field evidence of Giffen behaviour. Evidence
  is strong for rice in Hunan and weaker for wheat in Gansu, and the effect is
  concentrated among the poor rather than the poorest, as the subsistence model
  predicts.
