id: goodhart-1975-monetary-management
type: primary-source
title: "Problems of Monetary Management: The U.K. Experience"
authors:
  - Charles A. E. Goodhart
year: 1975
publisher: Reserve Bank of Australia
journal: "Papers in Monetary Economics, Volume I"
notes: >-
  A conference paper on British monetary targeting, later reprinted in Goodhart's
  Monetary Theory and Practice (1984). The remark that became the law is an aside
  about statistical regularities collapsing once policy leans on them. Goodhart
  himself never called it a law.
