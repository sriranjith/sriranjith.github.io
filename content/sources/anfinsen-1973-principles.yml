id: anfinsen-1973-principles
type: paper
title: Principles that Govern the Folding of Protein Chains
authors:
  - Christian B. Anfinsen
year: 1973
journal: Science
volume: "181(4096), 223–230"
notes: >-
  Anfinsen's Nobel lecture in print. States the thermodynamic hypothesis: the
  native structure of a protein is determined entirely by its amino acid
  sequence, and corresponds to the conformation of lowest free energy under
  physiological conditions. This is the claim Levinthal's counting argument was
  aimed at.
