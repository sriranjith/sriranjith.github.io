id: rawls-1971-theory-of-justice
type: book
title: A Theory of Justice
authors:
  - John Rawls
year: 1971
publisher: Harvard University Press
notes: >-
  Section 35, "Toleration of the Intolerant", argues that an intolerant sect has
  no title to complain of intolerance, but that the tolerant should nevertheless
  restrict its liberty only when they sincerely and with reason believe that
  their own security and that of free institutions is in danger.
