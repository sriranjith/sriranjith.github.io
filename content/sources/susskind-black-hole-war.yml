id: susskind-black-hole-war
type: book
title: "The Black Hole War: My Battle with Stephen Hawking to Make the World Safe for Quantum Mechanics"
authors:
  - Leonard Susskind
year: 2008
publisher: Little, Brown and Company
notes: >-
  A partisan but vivid first-person account of the information paradox from the
  1981 San Francisco meeting where Hawking presented the argument, through
  complementarity and holography, to Hawking's concession.
