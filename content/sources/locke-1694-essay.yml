id: locke-1694-essay
type: primary-source
title: An Essay Concerning Human Understanding
authors:
  - John Locke
year: "1689; chapter on identity added in the second edition, 1694"
publisher: Thomas Basset / Awnsham and John Churchill
notes: >-
  Book II, chapter 27, "Of Identity and Diversity", introduces the idea that
  identity conditions differ by kind - a mass of matter, a living oak and a
  person each persist under different rules - and grounds personal identity in
  continuity of consciousness rather than in substance. Locke's oak and his
  prince-and-cobbler case are the direct ancestors of every modern discussion of
  the Ship of Theseus applied to people.
