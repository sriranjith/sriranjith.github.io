id: nozick-1969-newcomb
type: academic-reference
title: "Newcomb's Problem and Two Principles of Choice"
authors:
  - Robert Nozick
year: "1969"
publisher: D. Reidel
notes: >-
  Published in Nicholas Rescher (ed.), Essays in Honor of Carl G. Hempel (1969).
  The paper that introduced Newcomb's Problem to academic philosophy, crediting
  the problem to physicist William Newcomb. Nozick presents both the dominance
  argument and the expected-utility argument without adjudicating between them,
  and notes that the problem isolates a genuine disagreement between two
  decision-theoretic principles.
