id: van-heijenoort-1967
type: book
title: "From Frege to Gödel: A Source Book in Mathematical Logic, 1879–1931"
authors:
  - Jean van Heijenoort
year: 1967
publisher: Harvard University Press
notes: >-
  The standard English source book for the foundational period. Contains
  Russell's 1902 letter to Frege and Frege's reply, Zermelo's 1908
  axiomatisation, Russell's 1908 theory of types, and Gödel's 1931 paper, each
  with an editorial introduction.
