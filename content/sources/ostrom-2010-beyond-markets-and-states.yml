id: ostrom-2010-beyond-markets-and-states
type: paper
title: "Beyond Markets and States: Polycentric Governance of Complex Economic Systems"
authors:
  - Elinor Ostrom
year: 2010
journal: American Economic Review
volume: "100(3), 641-672"
doi: 10.1257/aer.100.3.641
notes: >-
  Ostrom's Nobel lecture. Summarises the laboratory and field evidence against
  the assumption that resource users are trapped, and sets out the polycentric
  alternative to the choice between privatisation and central regulation.
