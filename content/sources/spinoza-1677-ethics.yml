id: spinoza-1677-ethics
type: primary-source
title: "Ethics (Ethica, Ordine Geometrico Demonstrata)"
authors:
  - Baruch Spinoza
year: 1677
publisher: "Published posthumously in the Opera Posthuma"
notes: >-
  The scholium to Part II, proposition 49, contains one of the earliest explicit
  discussions of the ass in equilibrium. Spinoza concedes that a person placed
  in perfect equilibrium would indeed perish of hunger and thirst, and remarks
  that such a being should be reckoned an ass rather than a man - accepting the
  consequence rather than treating it as a reductio.
