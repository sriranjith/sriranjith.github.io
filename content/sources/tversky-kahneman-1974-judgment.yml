id: tversky-kahneman-1974-judgment
type: paper
title: "Judgment under Uncertainty: Heuristics and Biases"
authors:
  - Amos Tversky
  - Daniel Kahneman
year: 1974
journal: Science
volume: "185(4157)"
pages: "1124–1131"
doi: 10.1126/science.185.4157.1124
notes: >-
  The landmark paper that introduced the anchoring-and-adjustment heuristic,
  alongside availability and representativeness. Tversky and Kahneman showed
  through experiments that people's numerical estimates are systematically
  pulled toward an initial value (the anchor), even when the anchor is
  clearly arbitrary (generated by spinning a wheel of fortune in front of
  subjects). The paper documented that the bias persists even when subjects
  know the anchor is irrelevant. Kahneman received the Nobel Prize in
  Economics in 2002 partly for this work.
