id: plutarch-life-of-theseus
type: primary-source
title: "Life of Theseus (Parallel Lives)"
authors:
  - Plutarch
year: "c. 100"
publisher: "Standard English text: Bernadotte Perrin, Loeb Classical Library, 1914"
notes: >-
  Chapter 23.1 records that the thirty-oared ship in which Theseus sailed was
  preserved by the Athenians down to the time of Demetrius of Phalerum, its
  decaying planks replaced with new timber, and that it had become a standing
  example for philosophers arguing about growth and change - one side holding
  the ship remained the same, the other that it did not. Plutarch reports the
  dispute; he does not invent it and does not settle it.
