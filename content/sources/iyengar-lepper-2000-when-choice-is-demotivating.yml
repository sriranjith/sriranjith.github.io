id: iyengar-lepper-2000-when-choice-is-demotivating
type: paper
title: "When Choice is Demotivating: Can One Desire Too Much of a Good Thing?"
authors:
  - Sheena S. Iyengar
  - Mark R. Lepper
year: 2000
journal: Journal of Personality and Social Psychology
volume: "79(6), 995-1006"
doi: 10.1037/0022-3514.79.6.995
notes: >-
  Three studies, the first of them the jam tasting-table field experiment at
  Draeger's market in Menlo Park. The source of the figures - 60 per cent versus
  40 per cent of passers-by stopping, 3 per cent versus 30 per cent of those
  buying - that made the idea famous.
