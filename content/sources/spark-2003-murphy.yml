id: spark-2003-murphy
type: paper
title: "Murphy's Law"
authors:
  - Nick T. Spark
year: 2003
journal: Annals of Improbable Research
volume: "9(5)"
url: https://www.improbable.com/airchives/paperair/volume9/v9i5/murphy.html
notes: >-
  The most thorough account of the law's actual origin at Edwards Air Force Base
  in 1949, including interviews with participants and a careful analysis of the
  competing origin stories. Distinguishes the engineering formulation from the
  popular pessimistic version.
