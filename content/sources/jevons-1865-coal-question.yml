id: jevons-1865-coal-question
type: primary-source
title: "The Coal Question: An Inquiry Concerning the Progress of the Nation, and the Probable Exhaustion of Our Coal-Mines"
authors:
  - William Stanley Jevons
year: 1865
publisher: "Macmillan, London"
notes: >-
  Chapter VII, "Of the Economy of Fuel", contains the efficiency argument: "It is
  wholly a confusion of ideas to suppose that the economical use of fuel is
  equivalent to a diminished consumption. The very contrary is the truth." The
  evidence is drawn from the steam engine and from the Scottish iron industry
  after the hot blast. The book's forecast of imminent British coal exhaustion
  was wrong; the mechanism has aged much better.
