id: hawking-2005-information-loss
type: primary-source
title: "Information loss in black holes"
authors:
  - S. W. Hawking
year: 2005
journal: Physical Review D
volume: "72, 084013"
doi: 10.1103/PhysRevD.72.084013
notes: >-
  The written version of Hawking's July 2004 announcement in Dublin that he had
  changed his mind and that information is preserved. He conceded a 1997 bet to
  John Preskill. The argument, based on a sum over topologies in a Euclidean
  path integral, convinced few of his colleagues even though the conclusion was
  widely accepted on other grounds.
