id: barnes-presocratic-philosophers
type: book
title: The Presocratic Philosophers
authors:
  - Jonathan Barnes
year: 1982
publisher: "Routledge & Kegan Paul (revised one-volume edition)"
notes: >-
  A philosopher's history rather than a philologist's. Barnes reconstructs the
  Presocratic arguments as arguments, in explicit premise-and-conclusion form,
  and asks whether they are any good. His treatment of Zeno and of the sophists
  is the most argumentatively rigorous available at book length.
