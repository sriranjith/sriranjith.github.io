id: sep-st-petersburg
type: encyclopedia
title: The St. Petersburg Paradox
authors:
  - Martin Peterson
publisher: Stanford Encyclopedia of Philosophy
url: https://plato.stanford.edu/entries/paradox-stpetersburg/
notes: >-
  Surveys the resolutions — diminishing marginal utility, bounded utility,
  finite bankrolls, rejecting expected value outright — and explains why none of
  them has closed the question in the way a textbook resolution would.
