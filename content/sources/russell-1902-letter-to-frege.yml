id: russell-1902-letter-to-frege
type: primary-source
title: "Letter to Frege, 16 June 1902"
authors:
  - Bertrand Russell
year: 1902
publisher: "In van Heijenoort, From Frege to Gödel (Harvard University Press, 1967), pp. 124–125"
notes: >-
  Two paragraphs of courtesy followed by the sentence that broke Frege's system:
  the predicate of being a predicate that cannot be predicated of itself. Frege's
  reply of 22 June 1902 is printed immediately after it, pp. 126–128.
