id: keane-2015-bowhead-genome
type: paper
title: Insights into the Evolution of Longevity from the Bowhead Whale Genome
authors:
  - Michael Keane
  - Jeremy Semeiks
  - Andrew E. Webb
  - Yang I. Li
  - Víctor Quesada
  - Thomas Craig
  - João Pedro de Magalhães
year: 2015
journal: Cell Reports
volume: "10(1), 112–122"
notes: >-
  Sequences the genome of the longest-lived mammal known and identifies changes
  in genes governing DNA repair, cell cycle control and ageing, offering
  candidate mechanisms for its resistance to cancer over a two-century lifespan.
