id: fine-1975-vagueness-truth-logic
type: paper
title: "Vagueness, Truth and Logic"
authors:
  - Kit Fine
year: 1975
journal: Synthese
volume: "30(3/4)"
pages: "265–300"
notes: >-
  The definitive development of supervaluationism. A vague sentence counts as
  true if it comes out true on every admissible way of making the language
  precise, false if false on every one, and neither otherwise. Classical
  tautologies survive because they hold on every sharpening, yet no particular
  grain is the one that makes the heap. Fine's notion of penumbral connection -
  the constraint that sharpenings must respect logical relations between vague
  terms - is the paper's central technical contribution.
