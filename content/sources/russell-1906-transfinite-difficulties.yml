id: russell-1906-transfinite-difficulties
type: primary-source
title: "On Some Difficulties in the Theory of Transfinite Numbers and Order Types"
authors:
  - Bertrand Russell
year: 1906
journal: "Proceedings of the London Mathematical Society, series 2"
volume: "4"
pages: "29–53"
notes: >-
  Read to the Society in December 1905. This is where Berry's paradox first
  appears in print, credited by Russell to "Mr G. G. Berry of the Bodleian
  Library", in the form of the least integer not nameable in fewer than nineteen
  syllables.
