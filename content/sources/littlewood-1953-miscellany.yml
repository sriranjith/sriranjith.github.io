id: littlewood-1953-miscellany
type: primary-source
title: A Mathematician's Miscellany
authors:
  - John Edensor Littlewood
year: 1953
publisher: Methuen, London
notes: >-
  Contains, in a few lines, a two-player card version of the exchange paradox
  that Littlewood attributes to Erwin Schrödinger — among the earliest records
  of the argument. Reissued with additional material as "Littlewood's
  Miscellany", edited by Béla Bollobás, Cambridge University Press, 1986.
