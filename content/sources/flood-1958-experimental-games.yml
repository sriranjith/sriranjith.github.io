id: flood-1958-experimental-games
type: primary-source
title: Some Experimental Games
authors:
  - Merrill M. Flood
year: 1958
journal: Management Science
volume: "5(1), 5-26"
doi: 10.1287/mnsc.5.1.5
notes: >-
  Flood's write-up of the January 1950 RAND experiment he and Melvin Dresher
  devised, including the full round-by-round record of the hundred-play game
  between Armen Alchian and John Williams and the running commentary the two
  players wrote as they went. This is the earliest documented instance of the
  game later named the Prisoner's Dilemma, and the earliest evidence that real
  players do not simply defect.
