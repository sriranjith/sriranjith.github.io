id: kraitchik-1953-recreations
type: primary-source
title: Mathematical Recreations
authors:
  - Maurice Kraitchik
year: 1953
publisher: Dover Publications (2nd revised edition)
notes: >-
  Contains "The Paradox of the Neckties" and the wallet variant, in which two
  men each calculate that trading is to their advantage. Kraitchik states the
  contradiction and leaves it there. First published in French as "Les
  Mathématiques des Jeux ou Récréations Mathématiques" (1930).
