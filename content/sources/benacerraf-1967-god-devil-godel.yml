id: benacerraf-1967-god-devil-godel
type: paper
title: "God, the Devil, and Gödel"
authors:
  - Paul Benacerraf
year: 1967
journal: The Monist
volume: "51(1)"
pages: "9–32"
notes: >-
  The classic reply to Lucas. Benacerraf grants that no machine can prove its own
  Gödel sentence, then shows that a human cannot know which machine she is and
  that she is consistent, which is exactly what the argument needs.
