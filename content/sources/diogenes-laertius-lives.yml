id: diogenes-laertius-lives
type: primary-source
title: Lives and Opinions of Eminent Philosophers
authors:
  - Diogenes Laertius
year: "c. 230"
publisher: "Standard English text: R. D. Hicks, Loeb Classical Library, 1925"
notes: >-
  Book II.108 attributes the Liar, the Sorites and several related puzzles to
  Eubulides of Miletus - the earliest surviving attribution of the Liar to
  anybody. Book VII.196-197 catalogues Chrysippus' lost works on the Liar. Book
  IX.25-29 gives the life of Zeno of Elea. Book IX.50-56 covers Protagoras,
  including the claim that he was the first to charge a fee for teaching.
