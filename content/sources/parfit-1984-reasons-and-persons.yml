id: parfit-1984-reasons-and-persons
type: book
title: Reasons and Persons
authors:
  - Derek Parfit
year: 1984
publisher: "Clarendon Press / Oxford University Press"
notes: >-
  Part III argues that personal identity is not what matters. Through
  teletransportation and fission cases Parfit contends that questions of the
  form "would that still be me?" can be empty - once every physical and
  psychological fact is fixed, there may be nothing further to determine. The
  claim converts the Ship of Theseus from an unanswered question into an
  ill-posed one.
