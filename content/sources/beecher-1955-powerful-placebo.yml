id: beecher-1955-powerful-placebo
type: paper
title: "The Powerful Placebo"
authors:
  - Henry K. Beecher
year: 1955
journal: JAMA
volume: "159(17)"
pages: "1602–1606"
doi: 10.1001/jama.1955.02960340022006
notes: >-
  The landmark paper that established the placebo effect as a major clinical
  phenomenon and quantified its magnitude. Beecher reviewed 15 controlled
  clinical trials and found that approximately 35% of patients experienced
  significant relief from placebos across a wide range of conditions. The paper
  made the placebo-controlled trial an ethical and scientific necessity, on the
  grounds that any treatment must demonstrate efficacy beyond the placebo
  response. It remains one of the most influential papers in clinical medicine,
  though later analysis has found that Beecher overstated the effect in some
  domains.
