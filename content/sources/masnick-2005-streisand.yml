id: masnick-2005-streisand
type: paper
title: "The Streisand Effect"
authors:
  - Mike Masnick
year: 2005
publisher: Techdirt
url: https://www.techdirt.com/2005/01/05/the-streisand-effect/
notes: >-
  The blog post that coined the term, written about a musician's attempt to
  suppress a critical website. Masnick credits the naming to the Streisand
  lawsuit of 2003, which caused aerial photographs of her home to be downloaded
  420,000 times after two previous downloads.
