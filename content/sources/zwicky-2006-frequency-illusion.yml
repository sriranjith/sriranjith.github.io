id: zwicky-2006-frequency-illusion
type: encyclopedia
title: "Frequency Illusion"
authors:
  - Arnold Zwicky
year: 2006
url: https://itre.cis.upenn.edu/~myl/languagelog/archives/002386.html
notes: >-
  The Language Log post in which Stanford linguist Arnold Zwicky coined the
  term "frequency illusion" for what the internet had been calling the
  Baader-Meinhof Phenomenon. Zwicky described two cooperating mechanisms:
  selective attention (once you notice something you look for it) and
  confirmation bias (each recurrence confirms the impression). The coinage
  gave researchers a working label for a phenomenon previously described only
  anecdotally. The original "Baader-Meinhof" name comes from a 1994 reader
  letter to the Saint Paul Pioneer Press.
