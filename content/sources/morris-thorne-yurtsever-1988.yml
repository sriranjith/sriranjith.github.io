id: morris-thorne-yurtsever-1988
type: paper
title: "Wormholes, Time Machines, and the Weak Energy Condition"
authors:
  - Michael S. Morris
  - Kip S. Thorne
  - Ulvi Yurtsever
year: 1988
journal: Physical Review Letters
volume: "61, 1446–1449"
doi: 10.1103/PhysRevLett.61.1446
notes: >-
  Showed that a traversable wormhole, if one could be held open, could be turned
  into a closed timelike curve by moving one mouth relativistically. This is the
  paper that made causality violation a mainstream physics problem again.
