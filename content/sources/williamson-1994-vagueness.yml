id: williamson-1994-vagueness
type: book
title: Vagueness
authors:
  - Timothy Williamson
year: 1994
publisher: "Routledge (The Problems of Philosophy series)"
notes: >-
  The canonical statement of epistemicism. Williamson argues that vague
  predicates do draw sharp boundaries, that classical logic and bivalence are
  therefore untouched, and that our inability to locate the boundary is
  ignorance rather than indeterminacy. Chapters 1-3 give the history of the
  sorites from Eubulides onward; chapter 8 develops the margin-for-error
  principle that explains why the boundary is unknowable in principle.
