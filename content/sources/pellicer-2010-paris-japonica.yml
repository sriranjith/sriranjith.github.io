id: pellicer-2010-paris-japonica
type: paper
title: "The Largest Eukaryotic Genome of Them All?"
authors:
  - Jaume Pellicer
  - Michael F. Fay
  - Ilia J. Leitch
year: 2010
journal: Botanical Journal of the Linnean Society
volume: "164(1), 10–15"
notes: >-
  Reports a 1C genome size of about 148.9 pg for the Japanese canopy plant Paris
  japonica, then the largest genome measured in any eukaryote — roughly fifty
  times the human genome.
