id: plato-meno
type: primary-source
title: Meno
authors:
  - Plato
year: "c. 380 BCE"
notes: >-
  One of Plato's middle dialogues, in which Socrates and Meno discuss the nature
  of virtue. At 80d-e Meno raises the paradox of inquiry: one cannot search for
  what one does not know, since one would not recognise it if found; and one need
  not search for what one already knows. Socrates responds with the doctrine of
  recollection — the idea that learning is the recovery of knowledge the soul
  possessed before birth, illustrated by eliciting a geometrical proof from an
  uneducated slave boy. The dialogue is the earliest surviving statement of the
  paradox of learning.
