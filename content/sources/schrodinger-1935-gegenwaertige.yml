id: schrodinger-1935-gegenwaertige
type: primary-source
title: "Die gegenwärtige Situation in der Quantenmechanik"
authors:
  - Erwin Schrödinger
year: 1935
journal: Naturwissenschaften
volume: "23, 807–812 (continued at 823–828 and 844–849)"
notes: >-
  The three-part essay in which the cat appears, in §5. Schrödinger calls the
  setup a "burlesque" case and presents it as showing that the naive reading of
  the wave function cannot be carried over to macroscopic objects. The same
  essay introduces the term Verschränkung — entanglement.
