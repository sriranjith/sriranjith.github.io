id: hanson-1998-great-filter
type: further-reading
title: "The Great Filter — Are We Almost Past It?"
authors:
  - Robin Hanson
year: 1998
url: https://mason.gmu.edu/~rhanson/greatfilter.html
notes: >-
  The essay that named the Great Filter. Its central move is probabilistic
  rather than astronomical: whatever makes visible interstellar civilisations
  rare must lie at some step between dead matter and expansion, and evidence
  that the early steps are easy is bad news, because it pushes the filter into
  our future.
