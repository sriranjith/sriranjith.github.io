id: feld-1991-friends
type: primary-source
title: "Why Your Friends Have More Friends Than You Do"
authors:
  - Scott L. Feld
year: 1991
journal: American Journal of Sociology
volume: "96(6), 1464–1477"
notes: >-
  The paper that named the friendship paradox, gave the variance-over-mean
  explanation, and demonstrated it in Coleman's data on friendships among
  adolescent girls. Feld is explicit that the effect is a sampling artefact of
  the network's degree distribution, not a fact about anyone's popularity.
