id: cox-1985-no-tragedy-of-the-commons
type: paper
title: No Tragedy of the Commons
authors:
  - Susan Jane Buck Cox
year: 1985
journal: Environmental Ethics
volume: "7(1), 49-61"
notes: >-
  Historical work on the English and Welsh open-field system. Shows that
  medieval commons were not open-access: rights were attached to holdings,
  stinting limited the number of animals each commoner could pasture, and manor
  courts enforced the limits. The historical case Hardin invoked is not an
  instance of the mechanism he described.
