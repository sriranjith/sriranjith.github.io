id: fouquet-pearson-2006-light
type: paper
title: "Seven Centuries of Energy Services: The Price and Use of Light in the United Kingdom (1300-2000)"
authors:
  - Roger Fouquet
  - Peter J. G. Pearson
year: 2006
journal: The Energy Journal
volume: "27(1), 139–177"
notes: >-
  Reconstructs the real price of a unit of light and the quantity consumed over
  seven centuries. Consumption rose by far more than efficiency alone would
  predict, making lighting the longest-run empirical case for the Jevons
  mechanism.
