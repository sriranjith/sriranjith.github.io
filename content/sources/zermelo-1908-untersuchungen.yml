id: zermelo-1908-untersuchungen
type: paper
title: "Untersuchungen über die Grundlagen der Mengenlehre I"
authors:
  - Ernst Zermelo
year: 1908
journal: Mathematische Annalen
volume: "65"
pages: "261–281"
notes: >-
  The first axiomatisation of set theory. Its Axiom III (Aussonderung, the axiom
  of separation) allows subsets to be carved only out of sets that already exist,
  which blocks Russell's construction and yields instead the theorem that no set
  contains everything. English translation in van Heijenoort.
