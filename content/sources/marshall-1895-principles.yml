id: marshall-1895-principles
type: primary-source
title: "Principles of Economics"
authors:
  - Alfred Marshall
year: 1895
publisher: "Macmillan, London (third edition)"
notes: >-
  The third edition is where the Giffen passage first appears, in Book III,
  chapter VI, on the law of demand. Marshall credits the observation to "Mr
  Giffen" with no citation, and no corresponding statement has been found in
  Giffen's published work. The paragraph survives in all later editions,
  including the eighth (1920), which is the one usually reprinted.
