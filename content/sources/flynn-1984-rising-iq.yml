id: flynn-1984-rising-iq
type: paper
title: "The Mean IQ of Americans: Massive Gains 1932 to 1978"
authors:
  - James R. Flynn
year: 1984
journal: Psychological Bulletin
volume: "95(1)"
pages: "29–51"
doi: 10.1037/0033-2909.95.1.29
notes: >-
  The paper that first systematically documented what became the Flynn Effect:
  IQ scores in the United States had risen by approximately 14 points between
  1932 and 1978, a gain too large and too consistent to be explained by genetic
  change. Flynn subsequently documented the same phenomenon in 14 other
  nations. The paper prompted fundamental questions about what IQ tests
  measure, whether the gains represent genuine intelligence increases, and what
  environmental factors drive them.
