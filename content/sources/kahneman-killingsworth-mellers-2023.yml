id: kahneman-killingsworth-mellers-2023
type: paper
title: "Income and emotional well-being: A conflict resolved"
authors:
  - Daniel Kahneman
  - Matthew A. Killingsworth
  - Barbara Mellers
year: 2023
journal: "Proceedings of the National Academy of Sciences"
volume: "120(10), e2208661120"
doi: 10.1073/pnas.2208661120
notes: >-
  A pre-registered adversarial collaboration between the authors of the two
  conflicting results, with Mellers as arbiter. Finds that wellbeing continues to
  rise with income for most people, and flattens above roughly $100,000 only for
  the least happy 15–20%. Widely cited as a model for resolving empirical
  disputes.
