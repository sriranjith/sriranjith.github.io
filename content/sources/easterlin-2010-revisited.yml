id: easterlin-2010-revisited
type: paper
title: "The happiness-income paradox revisited"
authors:
  - Richard A. Easterlin
  - Laura Angelescu McVey
  - Malgorzata Switek
  - Onnicha Sawangfa
  - Jacqueline Smith Zweig
year: 2010
journal: "Proceedings of the National Academy of Sciences"
volume: "107(52), 22463–22468"
doi: 10.1073/pnas.1015962107
notes: >-
  Easterlin's reply to Stevenson and Wolfers, covering 37 countries including 17
  developing and 11 transition economies. Draws the distinction that now defines
  his position: short-run correlations reflect business cycles, while over
  horizons of a decade or more there is no significant relationship between
  income growth and happiness growth.
