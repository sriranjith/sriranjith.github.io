id: keynes-1936-general-theory
type: book
title: "The General Theory of Employment, Interest and Money"
authors:
  - John Maynard Keynes
year: "1936"
publisher: Macmillan
notes: >-
  The foundational text of Keynesian economics. Chapter 24 discusses the paradox
  of thrift directly: individual saving is prudent but simultaneous saving by all
  economic actors can reduce aggregate income and leave everyone worse off.
  Keynes used this argument to justify government expenditure during recessions.
  The book overturned classical economics' assumption that markets automatically
  clear at full employment.
