id: poe-1848-eureka
type: primary-source
title: "Eureka: A Prose Poem"
authors:
  - Edgar Allan Poe
year: 1848
publisher: "Geo. P. Putnam, New York"
notes: >-
  Poe's speculative cosmology, and the first statement in print of the finite-age
  resolution: the gaps between the stars are dark because light from the most
  remote of them has not yet had time to arrive. Offered as intuition, with no
  physics behind it, and disregarded for well over a century.
