id: bertrand-1889-calcul
type: primary-source
title: Calcul des probabilités
authors:
  - Joseph Bertrand
year: 1889
publisher: Gauthier-Villars, Paris
notes: >-
  The box paradox appears in the opening pages, immediately after Bertrand's
  warning that probability problems must fix the procedure before they can be
  answered. The same book contains the unrelated and more famous "Bertrand
  paradox" about the length of a random chord.
