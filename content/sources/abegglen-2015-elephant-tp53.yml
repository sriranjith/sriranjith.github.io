id: abegglen-2015-elephant-tp53
type: paper
title: "Potential Mechanisms for Cancer Resistance in Elephants and Comparative Cellular Response to DNA Damage in Humans"
authors:
  - Lisa M. Abegglen
  - Aleah F. Caulin
  - Ashley Chan
  - Kristy Lee
  - Rosann Robinson
  - Michael S. Campbell
  - Wendy K. Kiso
  - Dennis L. Schmitt
  - Peter J. Waddell
  - Srividya Bhaskara
  - Shane T. Jensen
  - Carlo C. Maley
  - Joshua D. Schiffman
year: 2015
journal: JAMA
volume: "314(17), 1850–1860"
doi: 10.1001/jama.2015.13134
notes: >-
  Reports roughly 20 copies of TP53 in the African elephant genome against one in
  humans, and shows elephant cells responding to DNA damage with markedly higher
  rates of apoptosis. Also reports an estimated cancer mortality of under 5% in
  elephants from zoo necropsy records.
