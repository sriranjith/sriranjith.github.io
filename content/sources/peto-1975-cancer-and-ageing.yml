id: peto-1975-cancer-and-ageing
type: primary-source
title: Cancer and Ageing in Mice and Men
authors:
  - Richard Peto
  - F. J. C. Roe
  - P. N. Lee
  - L. Levy
  - J. Clack
year: 1975
journal: British Journal of Cancer
volume: "32(4), 411–426"
notes: >-
  A study of carcinogenesis timing in mice, whose discussion contains the
  observation that gave the paradox its name: humans have vastly more cells than
  mice and live far longer, yet are not correspondingly more cancer-prone.
