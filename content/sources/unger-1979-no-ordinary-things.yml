id: unger-1979-no-ordinary-things
type: paper
title: There Are No Ordinary Things
authors:
  - Peter Unger
year: 1979
journal: Synthese
volume: "41(2)"
pages: "117–154"
notes: >-
  Nihilism about vague objects, argued from the sorites run in reverse. If no
  single grain can make the difference between a heap and a non-heap, and there
  are clearly non-heaps, then by the same reasoning there are no heaps - and the
  argument generalises to stones, tables and clouds. Unger accepts the
  conclusion rather than blocking the argument. His companion paper "Why There
  Are No People" (Midwest Studies in Philosophy 4, 1979) extends it to persons.
