id: caulin-maley-2011-petos-paradox
type: paper
title: "Peto's Paradox: Evolution's Prescription for Cancer Prevention"
authors:
  - Aleah F. Caulin
  - Carlo C. Maley
year: 2011
journal: Trends in Ecology & Evolution
volume: "26(4), 175–182"
notes: >-
  The review that put the paradox on the comparative oncology agenda, cataloguing
  the candidate mechanisms — extra tumour suppressor copies, lower somatic
  mutation rates, shorter telomeres, redundant checkpoints — and arguing that
  large animals are a natural experiment in cancer prevention.
