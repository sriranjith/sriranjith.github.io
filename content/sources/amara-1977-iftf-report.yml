id: amara-1977-iftf-report
type: book
title: "The Futures Field: Searching for Definitions and Boundaries"
authors:
  - Roy Amara
year: 1977
journal: The Futurist
volume: "11(1)"
pages: "25–29"
notes: >-
  A representative early publication by Roy Amara, president of the Institute
  for the Future (IFTF), in which his characteristic framing of technology
  forecasting appeared. Amara articulated what became Amara's Law during his
  leadership of IFTF in the 1970s, though the aphorism does not appear in a
  single definitive source. The most cited statement is: "We tend to
  overestimate the effect of a technology in the short run and underestimate
  the effect in the long run." This appeared in various IFTF publications and
  conference presentations through the 1970s and 1980s before entering wide
  circulation.
