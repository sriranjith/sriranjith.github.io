id: battalio-kagel-kogut-1991
type: paper
title: "Experimental Confirmation of the Existence of a Giffen Good"
authors:
  - Raymond C. Battalio
  - John H. Kagel
  - Carl A. Kogut
year: 1991
journal: American Economic Review
volume: "81(4), 961–970"
notes: >-
  Laboratory rats choosing between quinine water and root beer under a budget of
  lever presses display upward-sloping demand. Establishes that the mechanism
  works in a system with the right structure, seventeen years before the field
  evidence in humans.
