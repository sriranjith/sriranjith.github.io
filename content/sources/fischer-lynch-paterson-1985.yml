id: fischer-lynch-paterson-1985
type: primary-source
title: "Impossibility of Distributed Consensus with One Faulty Process"
authors:
  - Michael J. Fischer
  - Nancy A. Lynch
  - Michael S. Paterson
year: 1985
journal: Journal of the ACM
volume: "32(2)"
pages: "374–382"
doi: 10.1145/3149.214121
notes: >-
  Proves that no deterministic protocol guarantees consensus in an asynchronous
  message-passing system in which a single process may crash. The argument
  constructs an infinite execution that never decides, by showing that a
  bivalent configuration can always be extended to another bivalent
  configuration.
