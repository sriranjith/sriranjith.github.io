id: shaw-1958-unexpected-examination
type: paper
title: The Paradox of the Unexpected Examination
authors:
  - R. Shaw
year: 1958
journal: Mind
volume: "67(267)"
pages: "382–384"
notes: >-
  The first clear diagnosis of the announcement as self-referential. Shaw
  observes that the teacher's statement quantifies over what the pupils will be
  able to deduce from that very statement, which places it in the same family as
  the Liar rather than in the family of ordinary predictions.
