id: amps-2013-firewalls
type: primary-source
title: "Black Holes: Complementarity or Firewalls?"
authors:
  - Ahmed Almheiri
  - Donald Marolf
  - Joseph Polchinski
  - James Sully
year: 2013
journal: "Journal of High Energy Physics"
volume: "2013(2), 062 (arXiv:1207.3123)"
doi: 10.1007/JHEP02(2013)062
notes: >-
  The firewall argument. Shows that unitarity, effective field theory outside the
  horizon, and a featureless horizon for the infalling observer form an
  inconsistent triple; something has to give, and the most jarring option is a
  wall of high-energy quanta at the horizon.
