id: bernoulli-1713-montmort-letter
type: primary-source
title: Letter to Pierre Rémond de Montmort, 9 September 1713
authors:
  - Nicolaus Bernoulli
year: 1713
publisher: Printed in Montmort, Essay d'analyse sur les jeux de hazard, 2nd ed., 1713
notes: >-
  Where the wager is first posed. Nicolaus asks what a fair stake would be for a
  game whose expectation is unbounded, and neither he nor Montmort resolves it;
  the correspondence establishes the problem twenty-five years before Daniel
  Bernoulli's published answer.
