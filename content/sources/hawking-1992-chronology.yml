id: hawking-1992-chronology
type: primary-source
title: "Chronology protection conjecture"
authors:
  - S. W. Hawking
year: 1992
journal: Physical Review D
volume: "46, 603–611"
doi: 10.1103/PhysRevD.46.603
notes: >-
  Argues that vacuum fluctuations diverge on the chronology horizon, so the
  laws of physics conspire to prevent closed timelike curves from forming —
  "making the universe safe for historians".
