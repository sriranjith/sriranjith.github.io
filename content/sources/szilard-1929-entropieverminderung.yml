id: szilard-1929-entropieverminderung
type: paper
title: "Über die Entropieverminderung in einem thermodynamischen System bei Eingriffen intelligenter Wesen"
authors:
  - Leó Szilárd
year: 1929
journal: Zeitschrift für Physik
volume: "53"
pages: "840–856"
doi: 10.1007/BF01341281
notes: >-
  "On the decrease of entropy in a thermodynamic system by the intervention of
  intelligent beings." Introduces the one-molecule engine and argues that each
  binary measurement must be accompanied by at least k ln 2 of entropy
  production. Translated by Rapoport and Knoller in Behavioral Science 9 (1964),
  301–310.
