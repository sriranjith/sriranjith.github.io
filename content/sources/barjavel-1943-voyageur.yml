id: barjavel-1943-voyageur
type: primary-source
title: "Le Voyageur Imprudent"
authors:
  - René Barjavel
year: 1943
publisher: Denoël, Paris
notes: >-
  The novel usually credited with the canonical statement of the grandfather
  paradox. The traveller Saint-Menoux shoots an ancestor of his own — in the
  novel it is a great-grandfather encountered during the Napoleonic era, not the
  grandfather of the paradox's popular name.
