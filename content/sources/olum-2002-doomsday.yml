id: olum-2002-doomsday
type: paper
title: "The Doomsday Argument and the Number of Possible Observers"
authors:
  - Ken D. Olum
year: 2002
journal: The Philosophical Quarterly
volume: "52(207), 164–184"
notes: >-
  Argues that the Self-Indication Assumption — the anthropic counterpart of
  thirding — exactly cancels the probability shift that drives the Doomsday
  argument. The clearest statement of why the Sleeping Beauty answer has
  consequences well outside the puzzle.
