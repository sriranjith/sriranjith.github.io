id: sackett-1979-bias
type: paper
title: "Bias in analytic research"
authors:
  - David L. Sackett
year: 1979
journal: Journal of Chronic Diseases
volume: "32(1–2), 51–63"
notes: >-
  A catalogue of thirty-five biases in clinical research, including "admission
  rate bias", which Sackett names after Berkson. He also reports survey data in
  which hospitalisation rates differ enough between conditions to generate the
  artefact in practice.
