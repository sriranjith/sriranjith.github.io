id: sorrell-2007-rebound
type: academic-reference
title: "The Rebound Effect: An Assessment of the Evidence for Economy-wide Energy Savings from Improved Energy Efficiency"
authors:
  - Steve Sorrell
year: 2007
publisher: UK Energy Research Centre
notes: >-
  The most systematic review of the empirical rebound literature. Concludes that
  direct rebound for household energy services in developed countries is
  generally below 30%, that economy-wide rebound is larger but poorly identified,
  and that evidence for economy-wide backfire is weak rather than absent.
