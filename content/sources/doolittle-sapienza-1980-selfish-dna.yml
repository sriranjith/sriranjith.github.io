id: doolittle-sapienza-1980-selfish-dna
type: paper
title: "Selfish Genes, the Phenotype Paradigm and Genome Evolution"
authors:
  - W. Ford Doolittle
  - Carmen Sapienza
year: 1980
journal: Nature
volume: "284, 601–603"
notes: >-
  Argues that repetitive sequences need no function at the organismal level to
  persist: a sequence that copies itself faster than it is removed will
  accumulate whatever its effect on the host. Published alongside a companion
  argument by Orgel and Crick in the same issue.
