id: rindler-1961-length-contraction
type: paper
title: "Length Contraction Paradox"
authors:
  - Wolfgang Rindler
year: 1961
journal: American Journal of Physics
volume: "29(6)"
pages: "365–366"
doi: 10.1119/1.1937789
notes: >-
  The rod-and-hole variant of the barn-and-pole problem, and the paper that made
  this family of puzzles a standard teaching exercise. Rindler's treatment turns
  on the relativity of simultaneity and on the impossibility of perfectly rigid
  bodies in relativity.
