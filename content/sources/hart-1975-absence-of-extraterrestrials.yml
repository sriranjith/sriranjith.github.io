id: hart-1975-absence-of-extraterrestrials
type: paper
title: "An Explanation for the Absence of Extraterrestrials on Earth"
authors:
  - Michael H. Hart
year: 1975
journal: "Quarterly Journal of the Royal Astronomical Society"
volume: "16"
pages: "128–135"
url: https://ui.adsabs.harvard.edu/abs/1975QJRAS..16..128H/abstract
notes: >-
  The first rigorous statement of the modern argument. Hart sorts the candidate
  explanations into physical, sociological, temporal and "they came and left"
  categories, rejects each, and concludes that there are no extraterrestrial
  civilisations in the Galaxy. The modern Fermi paradox is Hart's argument, not
  Fermi's remark.
