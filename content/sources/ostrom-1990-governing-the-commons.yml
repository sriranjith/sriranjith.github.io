id: ostrom-1990-governing-the-commons
type: book
title: "Governing the Commons: The Evolution of Institutions for Collective Action"
authors:
  - Elinor Ostrom
year: 1990
publisher: Cambridge University Press
isbn: "9780521405997"
notes: >-
  The empirical answer to Hardin. Draws on field studies of Swiss alpine
  pastures, Japanese village forests, Spanish huerta irrigation and Philippine
  zanjeras, along with cases that failed, and extracts eight design principles
  common to the long-enduring systems.
