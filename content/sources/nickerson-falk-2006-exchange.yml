id: nickerson-falk-2006-exchange
type: paper
title: "The exchange paradox: Probabilistic and cognitive analysis of a psychological conundrum"
authors:
  - Raymond S. Nickerson
  - Ruma Falk
year: 2006
journal: Thinking & Reasoning
volume: "12(2), 181–213"
notes: >-
  Catalogues the many published "resolutions", shows that several of them are
  answers to different questions, and analyses why the flawed calculation is so
  persuasive even to readers who can spot the error when it is pointed out.
