title: "Particle Creation by Black Holes"
authors:
  - S. W. Hawking
year: 1975
journal: Communications in Mathematical Physics
volume: "43, 199–220"
doi: 10.1007/BF02345020
notes: >-
  The derivation of Hawking radiation: a black hole formed by collapse emits a
  thermal spectrum at temperature inversely proportional to its mass. Announced
  in 1974; this is the full paper.
