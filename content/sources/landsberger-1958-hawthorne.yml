id: landsberger-1958-hawthorne
type: book
title: "Hawthorne Revisited"
authors:
  - Henry A. Landsberger
year: 1958
publisher: Cornell University
notes: >-
  The book that coined the term "Hawthorne Effect" in a re-analysis of the
  Western Electric studies. Landsberger was the first to name and systematise
  the observation that workers' behaviour changed because they were being
  observed, independently of the experimental manipulations being tested.
