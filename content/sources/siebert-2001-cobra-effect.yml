id: siebert-2001-cobra-effect
type: book
title: "Der Kobra-Effekt: Wie man Irrwege der Wirtschaftspolitik vermeidet"
authors:
  - Horst Siebert
year: 2001
publisher: Deutsche Verlags-Anstalt
isbn: "9783421055781"
notes: >-
  The German-language book by economist Horst Siebert that named the cobra
  effect, using the colonial India cobra bounty story as the title metaphor:
  the British government's programme to reduce cobras by paying for dead ones
  led to the farming of cobras, increasing the snake population. Siebert applied
  the concept to analyse economic policy failures in Germany. The English
  edition (translated by Caroline Saul, Palgrave Macmillan, 2001) extended the
  analysis to wider economic policy. The term has since passed into general use
  in policy analysis and behavioural economics.
