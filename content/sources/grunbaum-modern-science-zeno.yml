id: grunbaum-modern-science-zeno
type: book
title: Modern Science and Zeno's Paradoxes
authors:
  - Adolf Grunbaum
year: 1967
publisher: Wesleyan University Press
notes: >-
  The most sustained defence of the view that the classical mathematical analysis
  of the continuum really does dispose of Zeno's arguments. Grunbaum carefully
  separates the mathematical question of whether the distances and times sum to a
  finite total from the physical question of whether such a run is a legitimate
  process, and argues that both come out in favour of motion.
