id: latane-darley-1968-bystander
type: paper
title: "Bystander Intervention in Emergencies: Diffusion of Responsibility"
authors:
  - Bibb Latané
  - John Darley
year: 1968
journal: Journal of Personality and Social Psychology
volume: "8(4)"
pages: "377–383"
doi: 10.1037/h0025589
notes: >-
  The landmark paper that coined "diffusion of responsibility" and provided
  the first controlled experimental demonstration of the bystander effect.
  Subjects who believed they were the sole witness to a seizure reported it
  far more quickly than those who believed others were also present. The paper
  was motivated by the 1964 murder of Kitty Genovese and the widespread (but
  later contested) reports that 38 neighbours witnessed the attack without
  calling police.
