id: merton-1968-matthew-effect
type: paper
title: "The Matthew Effect in Science"
authors:
  - Robert K. Merton
year: 1968
journal: Science
volume: "159(3810)"
pages: "56–63"
doi: 10.1126/science.159.3810.56
notes: >-
  The paper in which sociologist Robert Merton named the Matthew Effect,
  drawing on Matthew 25:29 ("For to him who has will more be given..."). Merton
  documented how eminent scientists receive disproportionate credit for
  collaborative and independent work, accumulating recognition that makes
  subsequent recognition more likely. The paper generalised an observation from
  citation data into a principle about cumulative advantage in social systems.
  The term has since been adopted far beyond science to describe any system
  where initial advantage compounds.
