id: gardner-1961-second-book
type: primary-source
title: The Second Scientific American Book of Mathematical Puzzles and Diversions
authors:
  - Martin Gardner
year: 1961
publisher: Simon & Schuster
notes: >-
  Collects Gardner's Scientific American columns of 1958–1960. The two-children
  problem appears in the chapter "Nine More Problems", from the October 1959
  column, with the answers 1/2 and 1/3. The later chapter "Probability and
  Ambiguity" returns to it and withdraws the unqualified 1/3, on the grounds
  that the answer depends on how the information was obtained.
