id: lewis-1976-time-travel
type: paper
title: "The Paradoxes of Time Travel"
authors:
  - David Lewis
year: 1976
journal: American Philosophical Quarterly
volume: "13(2), 145–152"
notes: >-
  The standard philosophical treatment. Argues the paradox rests on an
  equivocation in "can": the traveller can kill his grandfather relative to one
  set of facts and cannot relative to another, and only the second is what
  consistency requires.
