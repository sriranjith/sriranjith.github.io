id: tian-2013-naked-mole-rat
type: paper
title: High-Molecular-Mass Hyaluronan Mediates the Cancer Resistance of the Naked Mole Rat
authors:
  - Xiao Tian
  - Jorge Azpurua
  - Christopher Hine
  - Amita Vaidya
  - Max Myakishev-Rempel
  - Julia Ablaeva
  - Zhiyong Mao
  - Eviatar Nevo
  - Vera Gorbunova
  - Andrei Seluanov
year: 2013
journal: Nature
volume: "499, 346–349"
notes: >-
  Identifies an unusually large form of hyaluronan secreted by naked mole rat
  cells, and shows that removing it or the enzyme that makes it makes the cells
  susceptible to transformation. A single-molecule mechanism for early contact
  inhibition.
