title: Sorites Paradox
authors:
  - Dominic Hyde
  - Diana Raffman
publisher: Stanford Encyclopedia of Philosophy
notes: >-
  The best available map of the responses, organised by which premise each one
  denies: the tolerance principle, the inductive step, bivalence, or the
  existence of the objects themselves. Includes the ancient history and the
  higher-order vagueness problem that every non-epistemicist solution runs into.
