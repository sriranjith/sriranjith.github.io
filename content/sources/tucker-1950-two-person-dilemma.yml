id: tucker-1950-two-person-dilemma
type: primary-source
title: A Two-Person Dilemma
authors:
  - Albert W. Tucker
year: 1950
publisher: Stanford University (mimeographed notes)
notes: >-
  The talk in which Tucker attached the story of two separately interrogated
  prisoners to the Flood-Dresher payoff structure, and thereby named the
  dilemma. The original was an unpublished mimeograph; it was later reprinted in
  the UMAP Journal and in several game-theory anthologies.
