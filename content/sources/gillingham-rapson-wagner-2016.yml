id: gillingham-rapson-wagner-2016
type: paper
title: "The Rebound Effect and Energy Efficiency Policy"
authors:
  - Kenneth Gillingham
  - David Rapson
  - Gernot Wagner
year: 2016
journal: Review of Environmental Economics and Policy
volume: "10(1), 68–88"
notes: >-
  Separates the rebound channels, puts most direct estimates in the 5–40% range,
  and argues that backfire is unlikely for individual efficiency policies. Also
  makes the point that rebound consumption is partly a welfare gain rather than
  purely a policy failure.
