id: mpemba-osborne-1969
type: academic-reference
title: "Cool?"
authors:
  - Erasto Mpemba
  - Denis Osborne
year: "1969"
journal: Physics Education
volume: "4"
pages: "172–175"
doi: 10.1088/0031-9120/4/3/312
notes: >-
  The paper that introduced the Mpemba effect to the scientific literature.
  Written jointly by Tanzanian student Erasto Mpemba and physicist Denis Osborne,
  it reported experimental confirmation that hot water can freeze faster than
  cold water under identical external conditions. The paper's title is a single
  word with a question mark, reflecting the authors' own uncertainty about the
  mechanism. It is remarkable for placing a secondary-school student as first
  author on a research publication.
