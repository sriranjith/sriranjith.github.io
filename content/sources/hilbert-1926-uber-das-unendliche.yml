id: hilbert-1926-uber-das-unendliche
type: primary-source
title: "Über das Unendliche"
authors:
  - David Hilbert
year: 1926
journal: Mathematische Annalen
volume: "95, 161–190"
notes: >-
  The published version of Hilbert's address of 4 June 1925 in Münster, in
  memory of Weierstrass — source of "no one shall expel us from the paradise
  that Cantor has created". English translation in van Heijenoort, From Frege to
  Gödel (Harvard, 1967). The hotel itself is not in this text; it belongs to
  Hilbert's Göttingen lectures of the same period.
