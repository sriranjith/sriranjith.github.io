id: titelbaum-2013-ten-reasons
type: paper
title: "Ten Reasons to Care About the Sleeping Beauty Problem"
authors:
  - Michael G. Titelbaum
year: 2013
journal: Philosophy Compass
volume: "8(11), 1003–1017"
notes: >-
  A survey of what the problem connects to — conditionalisation, the Principal
  Principle, indifference, anthropic reasoning, quantum branching — and the
  cleanest short account of why philosophers have not simply moved on.
