id: chernev-2015-choice-overload
type: paper
title: "Choice Overload: A Conceptual Review and Meta-Analysis"
authors:
  - Alexander Chernev
  - Ulf Böckenholt
  - Joseph Goodman
year: 2015
journal: Journal of Consumer Psychology
volume: "25(2), 333-358"
doi: 10.1016/j.jcps.2014.08.002
notes: >-
  A second meta-analysis reaching a more permissive conclusion than Scheibehenne
  and colleagues: the average main effect is near zero, but four moderators -
  choice-set complexity, decision task difficulty, preference uncertainty and
  decision goal - reliably shift it. The current mainstream position.
