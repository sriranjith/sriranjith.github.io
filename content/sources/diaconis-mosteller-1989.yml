id: diaconis-mosteller-1989
type: paper
title: Methods for Studying Coincidences
authors:
  - Persi Diaconis
  - Frederick Mosteller
year: 1989
journal: Journal of the American Statistical Association
volume: "84(408), 853–861"
notes: >-
  Generalises the birthday calculation into a working toolkit for coincidences:
  near-matches, multiple matches, and the Poisson approximation that makes them
  tractable. Source of the "law of truly large numbers" — with a large enough
  sample, any outrageous thing is likely to happen.
