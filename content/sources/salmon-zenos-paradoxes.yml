id: salmon-zenos-paradoxes
type: book
title: "Zeno's Paradoxes"
authors:
  - "Wesley C. Salmon (editor)"
year: 1970
publisher: "Bobbs-Merrill; reissued by Hackett Publishing, 2001"
notes: >-
  The standard anthology of the twentieth-century debate, and the best single
  place to see that the paradoxes were not simply closed by calculus. Collects
  the key papers by Max Black, James Thomson, Paul Benacerraf, Adolf Grunbaum and
  Gregory Vlastos, with a long editorial introduction by Salmon.
