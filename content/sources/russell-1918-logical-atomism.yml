id: russell-1918-logical-atomism
type: primary-source
title: "The Philosophy of Logical Atomism"
authors:
  - Bertrand Russell
year: 1918
journal: The Monist
volume: "28–29 (1918–1919)"
notes: >-
  A series of eight lectures given in London in early 1918. The lectures on
  classes and the theory of types present the village barber who shaves all and
  only those who do not shave themselves, and dismiss it as an unserious puzzle
  whose answer is simply that there is no such barber.
