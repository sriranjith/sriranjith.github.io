id: dante-paradiso
type: primary-source
title: "Paradiso (Divina Commedia)"
authors:
  - Dante Alighieri
year: "c. 1321"
notes: >-
  Canto IV opens with the case directly: between two foods equally distant and
  equally tempting, a free man would starve before bringing either to his teeth.
  Dante uses it as a simile for his own inability to choose between two
  questions, and the passage shows the example was in circulation two decades
  before the earliest date usually given for Buridan's own teaching on the will.
