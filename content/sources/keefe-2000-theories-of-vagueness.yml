id: keefe-2000-theories-of-vagueness
type: book
title: Theories of Vagueness
authors:
  - Rosanna Keefe
year: 2000
publisher: Cambridge University Press
notes: >-
  The standard survey and comparison of the main positions - epistemicism,
  supervaluationism, degree theory, nihilism and contextualism - measured
  against a common list of desiderata. Keefe defends supervaluationism, but the
  book is usually read for its even-handed statement of what each theory has to
  pay for.
