title: "Victims of Groupthink: A Psychological Study of Foreign-Policy Decisions and Fiascoes"
authors:
  - Irving L. Janis
year: 1972
publisher: Houghton Mifflin
notes: >-
  The founding statement of groupthink, built on the Bay of Pigs, Pearl Harbor
  and the escalation in Vietnam. Cited here for contrast: Janis describes
  members who come to share a mistaken consensus, whereas Harvey describes
  members who never shared it at all.
