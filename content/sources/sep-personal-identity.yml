type: encyclopedia
title: Personal Identity
authors:
  - Eric T. Olson
publisher: Stanford Encyclopedia of Philosophy
notes: >-
  Sets out the psychological-continuity view descending from Locke against the
  biological or animalist view that a person persists as long as the organism
  does, and shows how transplant and fission cases separate them.
