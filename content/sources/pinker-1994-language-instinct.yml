id: pinker-1994-language-instinct
type: book
title: "The Language Instinct: How the Mind Creates Language"
authors:
  - Steven Pinker
year: 1994
publisher: William Morrow and Company
notes: >-
  Gives the most quoted restatement of Moravec's observation, and adds the
  economic corollary: as machine capability advances, stock analysts and
  engineers are in more danger of being replaced than gardeners, receptionists
  and cooks.
