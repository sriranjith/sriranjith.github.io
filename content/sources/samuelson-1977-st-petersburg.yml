id: samuelson-1977-st-petersburg
type: paper
title: "St. Petersburg Paradoxes: Defanged, Dissected, and Historically Described"
authors:
  - Paul A. Samuelson
year: 1977
journal: Journal of Economic Literature
volume: "15(1), 24–55"
notes: >-
  The standard historical survey, tracing two and a half centuries of attempted
  resolutions. Samuelson's verdict is that the paradox has been "resolved" many
  times over and keeps coming back, because each fix addresses a different one
  of its several independent problems.
