name: Validate and build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the single source of truth for the Node version, so CI and a
      # local checkout cannot drift. Astro 7 requires >= 22.12.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs first and on its own so a content error is reported as a content
      # error, with its actionable message, rather than as a build failure.
      - name: Validate content
        run: npm run validate

      - name: Build
        run: npx astro build

      - name: Content health report
        if: always()
        run: npm run health

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7
