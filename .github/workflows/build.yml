name: Validate and build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs first and on its own so a content error is reported as a content
      # error, with its actionable message, rather than as a build failure.
      - name: Validate content
        run: npm run validate

      - name: Build
        run: npx astro build

      - name: Content health report
        if: always()
        run: npm run health

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
